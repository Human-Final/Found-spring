<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방 | 분실물 센터</title>

    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/chat/chat.css}">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body>

<div th:replace="~{layout/header :: headerFragment}"></div>

<main class="chat-page">

    <section class="chat-wrap">

        <div class="chat-head">
            <h2>채팅방</h2>
        </div>

        <div id="chatBox" class="chat-box">

            <!-- 기존 DB 메시지 출력 -->
            <th:block th:each="msg, stat : ${messages}">

                <!-- 날짜 구분선 -->
                <div class="date-divider"
                     th:if="${stat.index == 0
                          or #temporals.format(messages[stat.index - 1].createdAt, 'yyyy-MM-dd')
                             != #temporals.format(msg.createdAt, 'yyyy-MM-dd')}"
                     th:text="${#temporals.format(msg.createdAt, 'yyyy년 M월 d일')}">
                    2026년 7월 7일
                </div>

                <div class="chat-message"
                     th:attr="data-date=${#temporals.format(msg.createdAt, 'yyyy-MM-dd')}"
                     th:classappend="${msg.senderId == loginId} ? ' mine' : ''">

                    <span class="sender" th:text="${msg.senderId}">
                        user
                    </span>

                    <span class="bubble">

                        <!-- 첨부파일이 있는 메시지 -->
                        <th:block th:if="${msg.fileList != null and !msg.fileList.isEmpty()}">

                            <th:block th:each="file : ${msg.fileList}">

                                <!-- 이미지 파일 -->
                                <img th:if="${#strings.endsWith(file.saveName.toLowerCase(), '.jpg')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.jpeg')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.png')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.gif')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.webp')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.jfif')}"
                                     th:src="${file.filePath}"
                                     class="chat-img">

                                <!-- 일반 파일 -->
                                <a th:unless="${#strings.endsWith(file.saveName.toLowerCase(), '.jpg')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.jpeg')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.png')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.gif')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.webp')
                                          or #strings.endsWith(file.saveName.toLowerCase(), '.jfif')}"
                                   th:href="${file.filePath}"
                                   th:text="'📎 ' + ${file.originalName}"
                                   download>
                                    파일
                                </a>

                            </th:block>

                        </th:block>

                        <!-- 일반 텍스트 메시지 -->
                        <span th:if="${msg.fileList == null or msg.fileList.isEmpty()}"
                              th:text="${msg.content}">
                            내용
                        </span>

                    </span>

                    <span class="chat-time"
                          th:text="${#temporals.format(msg.createdAt, 'a h:mm')}">
                        12:00
                    </span>

                </div>

            </th:block>

        </div>

        <div class="chat-input">

            <input id="fileInput"
                   type="file"
                   style="display:none;"
                   onchange="sendFileMessage()">

            <button type="button"
                    onclick="document.getElementById('fileInput').click()">
                📎
            </button>

            <input id="messageInput"
                   type="text"
                   placeholder="메시지를 입력하세요."
                   autocomplete="off"
                   onkeydown="if(event.key === 'Enter'){sendMessage();}">

            <button type="button" onclick="sendMessage()">
                전송
            </button>

        </div>

    </section>

</main>

<script th:inline="javascript">
    const chatNum = /*[[${chatNum}]]*/ 0;
    const loginId = /*[[${loginId}]]*/ "";
    const csrfToken = /*[[${_csrf.token}]]*/ "";
    const csrfHeader = /*[[${_csrf.headerName}]]*/ "";

    let stompClient = null;
    let connected = false;
    let lastMessageDate = null;

    const socket = new SockJS("/ws-stomp");
    stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {

        connected = true;

        stompClient.subscribe("/sub/chat/room/" + chatNum, function (message) {
            const msg = JSON.parse(message.body);
            appendMessage(msg);
        });

    }, function (error) {
        connected = false;
        console.error("STOMP 연결 실패:", error);
    });

    function sendMessage() {

        const input = document.getElementById("messageInput");
        const content = input.value.trim();

        if (content === "") {
            return;
        }

        if (!connected) {
            alert("채팅 서버 연결 중입니다. 잠시 후 다시 시도해 주세요.");
            return;
        }

        stompClient.send("/pub/chat/message", {}, JSON.stringify({
            chatNum: chatNum,
            senderId: loginId,
            content: content
        }));

        input.value = "";
        input.focus();
    }

    async function sendFileMessage() {

        const fileInput = document.getElementById("fileInput");
        const file = fileInput.files[0];

        if (!file) {
            return;
        }

        if (!connected) {
            alert("채팅 서버 연결 중입니다. 잠시 후 다시 시도해 주세요.");
            fileInput.value = "";
            return;
        }

        const formData = new FormData();
        formData.append("chatNum", chatNum);
        formData.append("file", file);

        const response = await fetch("/chat/file/upload", {
            method: "POST",
            headers: {
                [csrfHeader]: csrfToken
            },
            body: formData
        });

        const msg = await response.json();

        stompClient.send("/pub/chat/message", {}, JSON.stringify(msg));

        fileInput.value = "";
    }

    function appendMessage(msg) {

        const chatBox = document.getElementById("chatBox");

        if (!chatBox) {
            return;
        }

        const msgDate = getDateKey(msg.createdAt);

        if (lastMessageDate !== msgDate) {
            appendDateDivider(msg.createdAt);
            lastMessageDate = msgDate;
        }

        const messageDiv = document.createElement("div");
        messageDiv.classList.add("chat-message");
        messageDiv.dataset.date = msgDate;

        if (String(msg.senderId) === String(loginId)) {
            messageDiv.classList.add("mine");
        }

        const sender = document.createElement("span");
        sender.classList.add("sender");
        sender.textContent = msg.senderId;

        const bubble = document.createElement("span");
        bubble.classList.add("bubble");

        if (msg.fileList && msg.fileList.length > 0) {

            msg.fileList.forEach(function (file) {

                if (isImageFile(file.saveName)) {
                    const img = document.createElement("img");
                    img.src = file.filePath;
                    img.classList.add("chat-img");
                    bubble.appendChild(img);
                } else {
                    const link = document.createElement("a");
                    link.href = file.filePath;
                    link.download = file.originalName;
                    link.textContent = "📎 " + file.originalName;
                    bubble.appendChild(link);
                }

            });

        } else {
            bubble.textContent = msg.content;
        }

        const time = document.createElement("span");
        time.classList.add("chat-time");
        time.textContent = formatChatTime(msg.createdAt);

        messageDiv.appendChild(sender);
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(time);

        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function isImageFile(fileName) {
        if (!fileName) {
            return false;
        }

        const lowerName = fileName.toLowerCase();

        return lowerName.endsWith(".jpg")
            || lowerName.endsWith(".jpeg")
            || lowerName.endsWith(".png")
            || lowerName.endsWith(".gif")
            || lowerName.endsWith(".webp")
            || lowerName.endsWith(".jfif");
    }

    function getDateKey(createdAt) {
        const date = createdAt ? new Date(createdAt) : new Date();

        return date.getFullYear() + "-" +
            String(date.getMonth() + 1).padStart(2, "0") + "-" +
            String(date.getDate()).padStart(2, "0");
    }

    function appendDateDivider(createdAt) {
        const chatBox = document.getElementById("chatBox");
        const date = createdAt ? new Date(createdAt) : new Date();

        const divider = document.createElement("div");
        divider.classList.add("date-divider");

        divider.textContent =
            date.getFullYear() + "년 " +
            (date.getMonth() + 1) + "월 " +
            date.getDate() + "일";

        chatBox.appendChild(divider);
    }

    function formatChatTime(createdAt) {
        const date = createdAt ? new Date(createdAt) : new Date();

        return date.toLocaleTimeString("ko-KR", {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        });
    }

    window.addEventListener("load", function () {
        const chatBox = document.getElementById("chatBox");
        const messageList = document.querySelectorAll(".chat-message");
        const lastMessage = messageList[messageList.length - 1];

        if (lastMessage) {
            lastMessageDate = lastMessage.dataset.date;
        }

        if (chatBox) {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    });
</script>

</body>
</html>
