<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방 | 분실물 센터</title>

    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/chat/chat.css}">

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body>

<div th:replace="~{layout/header :: headerFragment}"></div>

<main class="chat-page">

    <section class="chat-wrap">

        <div class="chat-head">
            <h2>채팅방</h2>
        </div>

        <div id="chatBox" class="chat-box">

            <!-- 기존 DB 메시지 출력 -->
            <div th:each="msg : ${messages}"
                 class="chat-message"
                 th:classappend="${msg.senderId == loginId} ? ' mine' : ''">

                <span class="sender"
                      th:text="${msg.senderId}">
                    user
                </span>

                <span class="bubble"
                      th:text="${msg.content}">
                    내용
                </span>

                <span class = "chat-time"
                    th:text="${#temporals.format(msg.createdAt, 'a h:mm')}">
                    12:00
                </span>

            </div>

        </div>

        <div class="chat-input">

            <input id="messageInput"
                   type="text"
                   placeholder="메시지를 입력하세요."
                   autocomplete="off"
                   onkeydown="if(event.key === 'Enter'){sendMessage();}">

            <button type="button" onclick="sendMessage()">
                전송
            </button>

        </div>

    </section>

</main>

<script th:inline="javascript">
    const chatNum = [[${chatNum}]];
    const loginId = [[${loginId}]];

    let stompClient = null;
    let connected = false;

    // SockJS 연결
    const socket = new SockJS("/ws-stomp");
    stompClient = Stomp.over(socket);

    // 필요 없으면 로그 끄기
    // stompClient.debug = null;

    stompClient.connect({}, function () {

        connected = true;

        console.log("STOMP 연결 성공");
        console.log("구독 주소:", "/sub/chat/room/" + chatNum);

        // 현재 채팅방 구독
        stompClient.subscribe("/sub/chat/room/" + chatNum, function (message) {

            console.log("수신 메시지:", message.body);

            const msg = JSON.parse(message.body);

            // 수신 즉시 화면에 추가
            appendMessage(msg);
        });

    }, function (error) { 
        connected = false;
        console.error("STOMP 연결 실패:", error);
    });

    function sendMessage() {

        const input = document.getElementById("messageInput");
        const content = input.value.trim();

        if (content === "") {
            return;
        }

        if (!connected) {
            alert("채팅 서버 연결 중입니다. 잠시 후 다시 시도해 주세요.");
            return;
        }

        console.log("전송 메시지:", content);

        stompClient.send("/pub/chat/message", {}, JSON.stringify({
            chatNum: chatNum,
            senderId: loginId,
            content: content
        }));

        input.value = "";
        input.focus();
    }

    function appendMessage(msg) {

        const chatBox = document.getElementById("chatBox");

        if (!chatBox) {
            console.error("chatBox를 찾을 수 없습니다.");
            return;
        }

        const messageDiv = document.createElement("div");
        messageDiv.classList.add("chat-message");

        if (String(msg.senderId) === String(loginId)) {
            messageDiv.classList.add("mine");
        }

        const sender = document.createElement("span");
        sender.classList.add("sender");
        sender.textContent = msg.senderId;

        const bubble = document.createElement("span");
        bubble.classList.add("bubble");
        bubble.textContent = msg.content;

        const time = document.createElement("span");
        time.classList.add("chat-time");
        time.textContent = formatChatTime(msg.createdAt);

        messageDiv.appendChild(sender);
        messageDiv.appendChild(bubble);
        messageDiv.appendChild(time);

        chatBox.appendChild(messageDiv);

        chatBox.scrollTop = chatBox.scrollHeight;

        console.log("화면 추가 완료:", messageDiv);
    }

    function formatChatTime(createdAt) {
        const date = createdAt ? new Date(createdAt) : new Date();

        return date.toLocaleTimeString("ko-KR", {
            hour: "numeric",
            minute: "2-digit",
            hour12: true
        });
    }

    window.addEventListener("load", function () {
        const chatBox = document.getElementById("chatBox");

        if (chatBox) {
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    });
</script>

</body>
</html>
