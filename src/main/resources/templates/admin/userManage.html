<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>회원 관리 | 분실물 센터</title>

  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin/userManage.css}">
</head>

<body class="admin-user-page">

<!-- 헤더 -->
<div th:replace="layout/header :: headerFragment"></div>

<div class="admin-layout">

  <!-- 사이드바 -->
  <aside class="admin-sidebar">

    <button type="button" class="sidebar-toggle-btn" id="sidebarToggle">
      <svg class="sidebar-toggle-icon" viewBox="0 0 24 24" fill="none">
          <path d="M4 6h16M4 12h16M4 18h16"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"/>
      </svg>
    </button>    

    <nav class="admin-side-menu">

      <a th:href="@{/api/admin/boards}">
        <i data-lucide="panel-top"></i>
        <span>게시글 관리</span>
      </a>

      <a th:href="@{/api/admin/users}" class="active">
        <i data-lucide="user-round"></i>
        <span>회원 관리</span>
      </a>

      <a th:href="@{/api/admin/notices}">
        <i data-lucide="bell"></i>
        <span>공지사항 관리</span>
      </a>

      <a th:href="@{/api/admin/stats}">
        <i data-lucide="bar-chart-3"></i>
        <span>통계 관리</span>
      </a>

      <a th:href="@{/api/admin/inquiries}">
        <i data-lucide="message-square"></i>
        <span>문의 관리</span>
      </a>

      <a th:href="@{/api/admin/settings}">
        <i data-lucide="settings"></i>
        <span>설정</span>
      </a>

    </nav>
  </aside>

  <!-- 본문 -->
  <main class="admin-main">

    <section class="admin-page-title">
      <h1>회원 관리</h1>
      <p>전체 회원 정보를 조회하고 관리할 수 있습니다.</p>
    </section>

    <!-- 필터 -->
    <section class="user-filter-card">
      <form th:action="@{/test/users}" 
            method="get" 
            class="user-filter-form" 
            id="userFilterForm">

        <!-- 페이징용 -->
        <input type="hidden" name="page" id="pageInput" th:value="${conditionDTO.page}">
        <input type="hidden" name="size" th:value="${conditionDTO.size}">

        <div class="filter-top">
          <div class="filter-search-wrap">
            <input type="text"
                   name="keyword"
                   th:value="${conditionDTO.keyword}"
                   placeholder="아이디, 이름, 이메일 검색">

            <button type="submit" 
                    onclick="setPage(1)" 
                    class="filter-search-btn">
              검색
            </button>
          </div>

          <a th:href="@{/test/users}" class="filter-reset-btn">
            <i data-lucide="rotate-cw"></i>
            <span>초기화</span>
          </a>
        </div>

        <div class="filter-row">
          <div class="filter-label">회원 상태</div>

          <label class="filter-chip">
            <input type="checkbox" name="statuses" value="active"
                   th:checked="${conditionDTO.statuses.contains('active')}">
            <span>활성</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="statuses" value="dormant"
                   th:checked="${conditionDTO.statuses.contains('dormant')}">
            <span>휴면</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="statuses" value="blocked"
                   th:checked="${conditionDTO.statuses.contains('blocked')}">
            <span>정지</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="statuses" value="deleted"
                   th:checked="${conditionDTO.includeDeleted}">
            <span>탈퇴</span>
          </label>
        </div>

        <div class="filter-row">
          <div class="filter-label">권한</div>

          <label class="filter-chip">
            <input type="checkbox" name="roles" value="USER"
                   th:checked="${conditionDTO.roles.contains('USER')}">
            <span>일반 회원</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="roles" value="MANAGER"
                   th:checked="${conditionDTO.roles.contains('MANAGER')}">
            <span>관리자</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="roles" value="ADMIN"
                   th:checked="${conditionDTO.roles.contains('ADMIN')}">
              <span>최고관리자</span>
          </label>
        </div>

        <div class="filter-row">
          <div class="filter-label">가입일</div>

          <input type="date"
                 name="startDate"
                 class="filter-date"
                 th:value="${conditionDTO.startDate}">

          <span class="date-separator">~</span>

          <input type="date"
                 name="endDate"
                 class="filter-date"
                 th:value="${conditionDTO.endDate}">

          <div class="date-shortcuts">
            
            <div class="date-filter">
              <button type="button" data-range="today">오늘</button>
              <button type="button" data-range="7days">7일</button>
              <button type="button" data-range="1month" class="active">1개월</button>
              <button type="button" data-range="3months">3개월</button>
              <button type="button" data-range="all">전체</button>
            </div>

            <div class="download">
              <button type="button" id="downloadBtn" class="download-btn">
                 <svg class="download-icon"
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                <span>다운로드</span>
              </button>
            </div>

          </div>

          
        </div>

      </form>
    </section>

    <!-- 선택 액션 바 -->
    <section class="admin-bulk-bar">
      <label class="bulk-check">
        <input type="checkbox" id="checkAll">
        <span>전체 선택</span>
      </label>

      <div class="bulk-selected-text">
        선택된 회원 <strong id="selectedCount">0</strong>명
      </div>

      <div class="bulk-actions">

        <button type="button" class="bulk-stop-btn" id="bulkBlockBtn">
          <i data-lucide="circle-slash"></i>
          <span>삭제</span>
        </button>

        <button type="button" class="bulk-role-btn" id="bulkRoleBtn">
          <i data-lucide="user-cog"></i>
          <span>회원 추가</span>
        </button>

        <button type="button" class="bulk-save-btn" id="saveChangeBtn"
                sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_MANAGER', 'ADMIN', 'MANAGER')">
          변경사항 저장
        </button>

      </div>
    </section>

    <!-- 회원 테이블 -->
    <section class="admin-table-card">
      <table class="user-manage-table">
        <thead>
        <tr>
          <th>
            <input type="checkbox" id="tableCheckAll">
          </th>
          <th>아이디</th>
          <th>이름</th>
          <th>이메일</th>
          <th>전화번호</th>          
          <th>가입일</th>
          <th>권한</th>
          <th>상태</th>
          <th>탈퇴일</th>
          <th>관리</th>
        </tr>
        </thead>

        <tbody>
          <!-- 실제 DB 연결용 -->
          <tr th:each="user : ${userList}"
              th:data-user-id="${user.id}">
            <td>
              <input type="checkbox"
                     class="user-check"
                     name="userIds"
                     th:value="${user.id}"
                     th:if="${isAdmin or (isManager and user.role == 'USER')}">
            </td>

            <td>
              <span class="view-text" th:text="${user.id}">아이디</span>
            </td>
            
            <td>
              <span class="view-text name-text" th:text="${user.name}">이름</span>
              <input class="edit-input name-input" type="text" th:value="${user.name}" hidden>
            </td>

            <td>
              <span class="view-text email-text" th:text="${user.email}">이메일</span>
              <input class="edit-input email-input" type="text" th:value="${user.email}" hidden>
            </td>            

            <td>
              <span class="view-text tel-text" 
                    th:text="${user.tel != null and #strings.length(user.tel) == 11
                              ? #strings.substring(user.tel, 0, 3) + '-' 
                                + #strings.substring(user.tel, 3, 7) + '-' 
                                + #strings.substring(user.tel, 7, 11)
                              : user.tel}">
                전화번호
              </span>
              <input class="edit-input tel-input" 
                     type="text"
                     inputmode="numeric"
                     maxlength="13"
                     th:value="${user.tel != null and #strings.length(user.tel) == 11
                                ? #strings.substring(user.tel, 0, 3) + '-' 
                                  + #strings.substring(user.tel, 3, 7) + '-' 
                                  + #strings.substring(user.tel, 7, 11)
                                : user.tel}" 
                     hidden>
            </td>

            <td th:text="${user.signUp != null 
                          ? #temporals.format(user.signUp, 'yyyy.MM.dd') : '-'}">
              가입일
            </td>

            <td>
              <select class="role-select"
                      th:data-user-id="${user.id}"
                      th:data-original-role="${user.role}"
                      th:disabled="${!isAdmin}">

                <option value="USER"
                        th:selected="${user.role =='USER'}">
                  일반
                </option>

                <option value="MANAGER"
                        th:selected="${user.role =='MANAGER'}">
                  관리자
                </option>
                
                <option value="ADMIN"
                        th:selected="${user.role =='ADMIN'}">
                  최고관리자
                </option>   

              </select>                 
            </td>          

            <td>
              <select class="status-select"
                      th:data-user-id="${user.id}"
                      th:data-original-status="${user.isDeleted == 1 ? 'deleted' : user.status}"
                      th:data-db-status="${user.status}"
                      th:disabled="${!isAdmin and !(isManager and user.role == 'USER')}">

                  <option value="active"
                          th:selected="${user.status == 'active' and user.isDeleted == 0}">
                    활성
                  </option>

                  <option value="dormant"
                          th:selected="${user.status == 'dormant' and user.isDeleted == 0}">
                    휴면
                  </option>

                  <option value="blocked"
                          th:selected="${user.status == 'blocked' and user.isDeleted == 0}">
                    정지
                  </option>

                  <option value="deleted"
                          th:selected="${user.isDeleted == 1}">
                    탈퇴
                  </option>

              </select>
            </td>

            <td th:text="${user.deletedAt != null 
                          ? #temporals.format(user.deletedAt, 'yyyy.MM.dd') : '-'}">
              탈퇴일
            </td>

            <td class="table-actions">
              <button type="button" 
                      class="edit-btn">
                수정
              </button>           

              <a th:href="@{/test/users/detail/{id}(id=${user.id})}"
                 class="detail-btn"
                 th:data-detail-url="@{/test/users/detail/{id}(id=${user.id})}">
                상세보기
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- 빈 결과: 테이블 밖에서 출력 -->
    <section class="admin-empty-card"
             th:if="${userList == null or #lists.isEmpty(userList)}">
      <p>조회된 회원이 없습니다.</p>
    </section>

    <form id="userBulkUpdateForm"
          th:action="@{/test/users/edit}"
          method="post"
          style="display:none;">

      <input type="hidden"
             th:if="${_csrf != null}"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">
    </form>

    <!-- 페이지네이션 -->
    <section class="admin-pagination"
            th:if="${userList != null and !#lists.isEmpty(userList)}">

      <!-- 이전 -->
      <button type="submit"
              form="userFilterForm"
              class="page-btn"
              th:disabled="${paging.page <= 1}"
              th:onclick="|setPage(${paging.page - 1})|">
        <i data-lucide="chevron-left"></i>
      </button>

      <!-- 페이지 번호 -->
      <button type="submit"
              form="userFilterForm"
              class="page-btn"
              th:each="pageNum : ${#numbers.sequence(paging.startPage, paging.endPage)}"
              th:classappend="${pageNum == paging.page} ? ' active'"
              th:onclick="|setPage(${pageNum})|"
              th:text="${pageNum}">
        1
      </button>

      <!-- 다음 -->
      <button type="submit"
              form="userFilterForm"
              class="page-btn"
              th:disabled="${paging.page >= paging.totalPage}"
              th:onclick="|setPage(${paging.page + 1})|">
        <i data-lucide="chevron-right"></i>
      </button>

    </section>
    
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  
  // **기본 초기화
  if (window.lucide) {
    lucide.createIcons();
  }
  

  // **변수 선언 ------------
  const pendingUserChanges = new Map();
  
  // 체크박스
  const checkAll = document.getElementById("checkAll");
  const tableCheckAll = document.getElementById("tableCheckAll");
  const userChecks = document.querySelectorAll(".user-check");
  const selectedCount = document.getElementById("selectedCount");

  // 버튼
  const saveChangesBtn = document.getElementById("saveChangeBtn");
  const userBulkUpdateForm = document.getElementById("userBulkUpdateForm");
  const rangeButtons = document.querySelectorAll(".date-filter button");

  // 입력창
  const startDateInput = document.querySelector("input[name='startDate']");
  const endDateInput = document.querySelector("input[name='endDate']");

  // 그 외
  const sidebarToggle = document.getElementById("sidebarToggle");  

  // **input 최초값 저장 ------------
  document.querySelectorAll(".edit-input").forEach(input => {
    if (input.classList.contains("tel-input")) {
      input.value = formatTel(input.value);
      input.dataset.serverValue = normalizeTel(input.value);
      input.dataset.originalValue = input.value;
    } else {
      input.dataset.serverValue = input.value.trim();
      input.dataset.originalValue = input.value;
    }
  });
  // 전화번호 자동 하이픈
  document.querySelectorAll(".tel-input").forEach(input => {
    input.addEventListener("input", () => {
      input.value = formatTel(input.value);
      clearInputError(input);
    });
  });

  document.querySelectorAll(".name-input, .email-input").forEach(input => {
    input.addEventListener("input", () => {
      clearInputError(input);
    });
  });
    

  // **권한/상태 드롭다운 태그 색상 + 변경 행 표시 ------------
  function refreshSelectStyle(select) {
    select.classList.remove(
      "role-admin",
      "role-manager",
      "role-user",
      "status-active",
      "status-dormant",
      "status-blocked",
      "status-deleted"
    );

    if (select.classList.contains("role-select")) {
      if (select.value === "ADMIN") {
        select.classList.add("role-admin");
      } else if (select.value === "MANAGER") {
        select.classList.add("role-manager");
      } else if (select.value === "USER") {
        select.classList.add("role-user");
      }
    }

    if (select.classList.contains("status-select")) {
      select.classList.add("status-" + select.value);
    }
  }

  function isRowModified(row) {
    const userId = row.dataset.userId;

    const roleSelect = row.querySelector(".role-select");
    const statusSelect = row.querySelector(".status-select");

    const profileChanged = pendingUserChanges.has(userId);

    const roleChanged =
      roleSelect &&
      !roleSelect.disabled &&
      roleSelect.dataset.originalRole !== roleSelect.value;

    const statusChanged =
      statusSelect &&
      !statusSelect.disabled &&
      statusSelect.dataset.originalStatus !== statusSelect.value;

    return profileChanged || roleChanged || statusChanged;
  }

  function refreshRowModified(row) {
    row.classList.toggle("modified", isRowModified(row));
  }

  document.querySelectorAll(".role-select, .status-select").forEach(select => {
    refreshSelectStyle(select);

    select.addEventListener("change", () => {
      refreshSelectStyle(select);
      refreshRowModified(select.closest("tr"));
    });
  });


  // **드롭다운 변경 -----------
  // 상태 변경 사항 
  function getStatusLabel(status){
    if(status === "active") return "활성";
    if(status === "dormant") return "휴면";
    if(status === "blocked") return "정지";
    if(status === "deleted") return "탈퇴";
    return status;
  }

  // 권한 변경 사항 
  function getRoleLabel(role) {
    if (role === "USER") return "일반";
    if (role === "MANAGER") return "관리자";
    if (role === "ADMIN") return "최고관리자";
    return role;
  }

  // deleted는 status 컬럼 아님. 화면에서 deleted를 선택시 isDeleted = 1을 전송
  function getSubmitStatus(select, selectedStatus){
    if(selectedStatus === "deleted"){
      return select.dataset.dbStatus;
    }
    
    return selectedStatus;
  }

  function getSubmitIsDeleted(selectedStatus){
    return selectedStatus === "deleted" ? 1 : 0;
  }


  // **회원 inline 수정 ------------
  // 수정하기 버튼 동작
  document.querySelectorAll(".edit-btn").forEach(button => {
    button.addEventListener("click", function(){
      const row = this.closest("tr");

      // 수정 모드가 아니면 수정 모드 진입
      if(!row.classList.contains("editing")){
        enterEditMode(row);
        return;
      }

      // 수정 모드에서 누르면 적용
      applyRowChange(row);
    });
  });

  // 상세보기 버튼 동작
 document.querySelectorAll(".detail-btn").forEach(button => {
    button.addEventListener("click", function(event){
      const row = this.closest("tr");

      // 수정 모드일 때는 취소로 동작
      if(row.classList.contains("editing")){
        event.preventDefault();
        cancelEditMode(row);
      }
    });
  });


  // 수정 모드에서의 동작
  function enterEditMode(row){
    row.classList.add("editing");

    // 원래 텍스트 숨김
    row.querySelectorAll(".view-text").forEach(el => {
      el.hidden = true;
    });

    // input 표시 + 원래 값 저장
    row.querySelectorAll(".edit-input").forEach(input => {
      input.hidden = false;
      input.dataset.originalValue = input.value;
    });

    const editBtn = row.querySelector(".edit-btn");
    const detailBtn = row.querySelector(".detail-btn");

    editBtn.textContent = "적용";
    detailBtn.textContent = "취소";
  }
  

  // 취소하기 버튼 동작
  function cancelEditMode(row){
    row.querySelectorAll(".edit-input").forEach(input => {
      input.value = input.dataset.originalValue;
      input.hidden = true;
    });

    row.querySelectorAll(".view-text").forEach(el => {
      el.hidden = false;
    });

    row.classList.remove("editing");

    const editBtn = row.querySelector(".edit-btn");
    const detailBtn = row.querySelector(".detail-btn");

    editBtn.textContent = "수정";
    detailBtn.textContent = "상세보기";
  }


  // **전화번호 입력시 자동 하이픈 추가 -----------------
  function onlyNumbers(value) {
    return value.replace(/[^0-9]/g, "");
  }

  function formatTel(value) {
    const numbers = onlyNumbers(value).slice(0, 11);

    if (numbers.length <= 3) {
      return numbers;
    }

    if (numbers.length <= 7) {
      return numbers.slice(0, 3) + "-" + numbers.slice(3);
    }

    return numbers.slice(0, 3) + "-" + numbers.slice(3, 7) + "-" + numbers.slice(7);
  }

  function normalizeTel(value) {
    return onlyNumbers(value);
  }

  function showInputError(input, message) {
    input.setCustomValidity(message);
    input.reportValidity();
    input.focus();
  }

  function clearInputError(input) {
    input.setCustomValidity("");
  }

  function applyRowChange(row){
    const userId = row.dataset.userId;

    const nameInput = row.querySelector(".name-input");
    const emailInput = row.querySelector(".email-input");
    const telInput = row.querySelector(".tel-input");

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const tel = normalizeTel(telInput.value);

    clearInputError(nameInput);
    clearInputError(emailInput);
    clearInputError(telInput);

    const namePattern = /^[가-힣a-zA-Z]{2,20}$/;
    const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.com$/;
    const telPattern = /^010[0-9]{8}$/;

    if (name === "") {
      showInputError(nameInput, "이름을 입력하세요.");
      return;
    }

    if (!namePattern.test(name)) {
      showInputError(nameInput, "이름은 한글 또는 영문 2~20자로 입력해야 합니다.");
      return;
    }

    if (email === "") {
      showInputError(emailInput, "이메일을 입력하세요.");
      return;
    }

    if (!emailPattern.test(email)) {
      showInputError(emailInput, "이메일은 영문/숫자 형식이어야 하며 .com으로 끝나야 합니다.");
      return;
    }

    if (tel === "") {
      showInputError(telInput, "전화번호를 입력하세요.");
      return;
    }

    if (!telPattern.test(tel)) {
      showInputError(telInput, "전화번호는 010으로 시작하는 숫자 11자리여야 합니다.");
      return;
    }

    // 화면 텍스트만 먼저 변경
    row.querySelector(".name-text").textContent = name;
    row.querySelector(".email-text").textContent = email;
    row.querySelector(".tel-text").textContent = formatTel(tel);

    // 변경사항 있을 시 최종 저장 전까지 JS에 임시 보관
    const originalName = nameInput.dataset.serverValue;
    const originalEmail = emailInput.dataset.serverValue;
    const originalTel = normalizeTel(telInput.dataset.serverValue);

    const isChanged =
      name !== originalName ||
      email !== originalEmail ||
      tel !== originalTel;

    if (isChanged) {
      pendingUserChanges.set(userId, {
        userId: userId,
        originalName: originalName,
        originalEmail: originalEmail,
        originalTel: originalTel,
        name: name,
        email: email,
        tel: tel
      });
    } else {
      pendingUserChanges.delete(userId);
    }
    
    refreshRowModified(row);

    // input의 기준값도 방금 적용한 값으로 갱신
    row.querySelectorAll(".edit-input").forEach(input => {
      if (input.classList.contains("tel-input")) {
        input.dataset.originalValue = input.value;
      } else {
        input.dataset.originalValue = input.value;
    }
      input.hidden = true;
    });

    row.querySelectorAll(".view-text").forEach(el => {
      el.hidden = false;
    });

    row.classList.remove("editing");

    const editBtn = row.querySelector(".edit-btn");
    const detailBtn = row.querySelector(".detail-btn");
    
    editBtn.textContent = "수정";
    detailBtn.textContent = "상세보기";
  }

  
  // 변경 사항 리스트로 만들어 두기 ----------
  // 상태
  function collectChangedStatuses(){
    const changedList = [];

    document.querySelectorAll(".status-select").forEach(select => {
      if (select.disabled) {
        return;
      }
        
      const userId = select.dataset.userId;
      const originalStatus = select.dataset.originalStatus;
      const currentStatus = select.value;

      if(originalStatus !== currentStatus){
        changedList.push({
          userId: userId,
          originalStatus: originalStatus,
          currentStatus: currentStatus,
          submitStatus: getSubmitStatus(select, currentStatus),
          submitIsDeleted: getSubmitIsDeleted(currentStatus)
        });
      }
    });

    return changedList;
  }

  // 권한
  function collectChangedRoles(){
    const changedList=[];

    document.querySelectorAll(".role-select").forEach(select => {
      if(select.disabled){
        return;
      }

      const userId = select.dataset.userId;
      const originalRole = select.dataset.originalRole;
      const currentRole = select.value;

      if(originalRole !== currentRole){
        changedList.push({
          userId: userId,
          originalRole: originalRole,
          currentRole: currentRole
        });
      }
    });

    return changedList;
  }

  // 회원정보
  function collectChangedProfiles(){
    return Array.from(pendingUserChanges.values());
  }


  // ** 상태/권한 변경 폼 hidden input 처리 -------------
  function removeOldDynamicInputs(){
    userBulkUpdateForm
    .querySelectorAll(".dynamic-bulk-input")
    .forEach(input => input.remove());
  }

  function appendHiddenInput(name, value){
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = name;
    input.value = value;
    input.classList.add("dynamic-bulk-input");

    userBulkUpdateForm.appendChild(input);
  }

    
  // ** 확인 메시지 출력 -----------
  function makeBulkConfirmMessage(statusChanges, roleChanges, profileChanges){
    const lines = [];
    
    // 상태 변경 있음
    if(statusChanges.length > 0){
      lines.push("[상태 변경]");

      statusChanges.forEach(item => {
        lines.push(`${item.userId}: ${getStatusLabel(item.originalStatus)} → ${getStatusLabel(item.currentStatus)}`);
      });
    }

    // 권한 변경 있음
    if(roleChanges.length > 0) {
      if(lines.length > 0) {
        lines.push("");
      }

      lines.push("[권한 변경]")

      roleChanges.forEach(item => {
        lines.push(`${item.userId}: ${getRoleLabel(item.originalRole)} → ${getRoleLabel(item.currentRole)}`);
      });
    }

    // 이름/이메일/전화번호 변경 있음
    if (profileChanges.length > 0) {
      if (lines.length > 0) {
        lines.push("");
      }

      lines.push("[회원 정보 변경]");

      profileChanges.forEach(item => {
        lines.push(`${item.userId}`);

        if (item.originalName !== item.name) {
          lines.push(`- 이름: ${item.originalName} → ${item.name}`);
        }

        if (item.originalEmail !== item.email) {
          lines.push(`- 이메일: ${item.originalEmail} → ${item.email}`);
        }

        if (item.originalTel !== item.tel) {
          lines.push(`- 전화번호: ${item.originalTel} → ${item.tel}`);
        }
      });
    }

      return `아래 변경사항을 저장하시겠습니까?\n\n${lines.join("\n")}`;
    }


    // **최종 변경사항 저장-------------
    if (saveChangesBtn && userBulkUpdateForm) {
      saveChangesBtn.addEventListener("click", () => {
        const editingRows = document.querySelectorAll("tr.editing");

      if (editingRows.length > 0) {
        alert("수정 중인 행이 있습니다. 먼저 적용 또는 취소를 눌러주세요.");
        return;
      }

      const statusChanges = collectChangedStatuses();
      const roleChanges = collectChangedRoles();
      const profileChanges = collectChangedProfiles();
      
      if (statusChanges.length === 0 
        && roleChanges.length === 0
        && profileChanges.length === 0) {
          alert("변경된 사항이 없습니다.");
          return;
      }

      const confirmed = confirm(
        makeBulkConfirmMessage(statusChanges, roleChanges, profileChanges)
      );

      if (!confirmed) {
        return;
      }

      removeOldDynamicInputs();

      statusChanges.forEach(item => {
        appendHiddenInput("statusUserIds", item.userId);
        appendHiddenInput("statuses", item.submitStatus);
        appendHiddenInput("isDeletedList", item.submitIsDeleted);
      });

      roleChanges.forEach(item => {
        appendHiddenInput("roleUserIds", item.userId);
        appendHiddenInput("roles", item.currentRole);
      });
      
      profileChanges.forEach(item => {
        appendHiddenInput("profileUserIds", item.userId);
        appendHiddenInput("names", item.name);
        appendHiddenInput("emails", item.email);
        appendHiddenInput("tels", item.tel);
      });

      userBulkUpdateForm.submit();
    });
  }


  // ** 체크 박스 전체 선택 --------------
  // 체크된 박스 카운팅
  function updateSelectedCount() {

    if (!selectedCount) {
      return;
    }

    const checkedCount = document.querySelectorAll(".user-check:checked").length;
    const isAllChecked = userChecks.length > 0 && checkedCount === userChecks.length;

    selectedCount.textContent = checkedCount;
    
    if (checkAll) {
      checkAll.checked = isAllChecked;
    }

    if (tableCheckAll) {
      tableCheckAll.checked = isAllChecked;
    }
  }


  function setAllChecked(checked) {
    userChecks.forEach(check => {
      check.checked = checked;
    });

    updateSelectedCount();
  }

  if (checkAll) {
    checkAll.addEventListener("change", () => {
      setAllChecked(checkAll.checked);
    });
  }

  if (tableCheckAll) {
    tableCheckAll.addEventListener("change", () => {
      setAllChecked(tableCheckAll.checked);
    });
  }

  userChecks.forEach(check => {
    check.addEventListener("change", updateSelectedCount);
  });

  updateSelectedCount();


  // **가입일 기간 버튼----------------
  function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }

  function setDateRange(range) {
    if (!startDateInput || !endDateInput) {
      return;
    }

    if (!range) {
      return;
    }
    
    const today = new Date();
    const startDate = new Date(today);
    const endDate = new Date(today);

    if (range === "today") {
      // 오늘 그대로
    } else if (range === "7days") {
      startDate.setDate(today.getDate() - 7);
    } else if (range === "1month") {
      startDate.setMonth(today.getMonth() - 1);
    } else if (range === "3months") {
      startDate.setMonth(today.getMonth() - 3);
    } else if (range === "all") {
      startDateInput.value = "";
      endDateInput.value = "";
      return;
    }else {
      return;
    }

    startDateInput.value = formatDate(startDate);
    endDateInput.value = formatDate(endDate);
  }

  rangeButtons.forEach(button => {
    button.addEventListener("click", () => {
      rangeButtons.forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");

      setDateRange(button.dataset.range);
    });
  });


  // **사이드바 접기----------------
  if (sidebarToggle) {
    const savedSidebarState = localStorage.getItem("adminSidebarCollapsed");

    if (savedSidebarState === "true") {
      document.body.classList.add("sidebar-collapsed");
    }

    sidebarToggle.addEventListener("click", function () {
      document.body.classList.toggle("sidebar-collapsed");

      const isCollapsed = document.body.classList.contains("sidebar-collapsed");
      localStorage.setItem("adminSidebarCollapsed", isCollapsed);
    });
  }
});

</script>

<script>
function setPage(page) {
  const pageInput = document.getElementById("pageInput");
  if (pageInput) {
    pageInput.value = page;
  }
}
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const downloadBtn = document.getElementById("downloadBtn");

    if (!downloadBtn) {
      return;
    }

    downloadBtn.addEventListener("click", function () {
      const params = new URLSearchParams();

      const keywordInput = document.querySelector("input[name='keyword']");
      const startDateInput = document.querySelector("input[name='startDate']");
      const endDateInput = document.querySelector("input[name='endDate']");

      const keyword = keywordInput ? keywordInput.value.trim() : "";
      const startDate = startDateInput ? startDateInput.value : "";
      const endDate = endDateInput ? endDateInput.value : "";

      if (keyword !== "") {
        params.append("keyword", keyword);
      }

      const statusLabels = [];
      const roleLabels = [];

      document.querySelectorAll("input[name='statuses']:checked")
        .forEach(function (input) {
          params.append("statuses", input.value);
          statusLabels.push(getLabelText(input));
        });

      document.querySelectorAll("input[name='roles']:checked")
        .forEach(function (input) {
          params.append("roles", input.value);
          roleLabels.push(getLabelText(input));
        });

      if (startDate !== "") {
        params.append("startDate", startDate);
      }

      if (endDate !== "") {
        params.append("endDate", endDate);
      }

      const confirmMessage =
        "현재 조건으로 회원 목록을 다운로드하시겠습니까?\n\n" +
        "검색어: " + (keyword || "전체") + "\n" +
        "회원 상태: " + (statusLabels.length > 0 ? statusLabels.join(", ") : "전체") + "\n" +
        "권한: " + (roleLabels.length > 0 ? roleLabels.join(", ") : "전체") + "\n" +
        "가입일: " + getDateRangeText(startDate, endDate);

      if (!confirm(confirmMessage)) {
        return;
      }

      const queryString = params.toString();

      if (queryString) {
        location.href = "/api/test/users/download?" + queryString;
      } else {
        location.href = "/api/test/users/download";
      }
    });
  });

  function getLabelText(input) {
    const label = input.closest("label");

    if (label) {
      return label.textContent.trim();
    }

    return input.value;
  }

  function getDateRangeText(startDate, endDate) {
    if (!startDate && !endDate) {
      return "전체";
    }

    if (startDate && endDate) {
      return startDate + " ~ " + endDate;
    }

    if (startDate) {
      return startDate + " 이후";
    }

    return endDate + " 이전";
  }
</script>
