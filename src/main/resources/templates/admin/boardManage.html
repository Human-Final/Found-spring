<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>게시글 관리 | 분실물 센터</title>

  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/admin/board.css}">
</head>

<body class="admin-user-page">

<script>
  (function(){
    const savedSidebarState = localStorage.getItem("adminSidebarCollapsed");

    if (savedSidebarState === null || savedSidebarState === "true"){
      document.body.classList.add("sidebar-collapsed")
    }

    document.body.classList.add("sidebar-init");
  })();
</script>


<!-- 헤더 -->
<header class="admin-header" th:replace="layout/header :: headerFragment">
</header>

<div class="admin-layout">

  <!-- 사이드바 -->
  <aside class="admin-sidebar">

    <button type="button" class="sidebar-toggle-btn" id="sidebarToggle">
      <svg class="sidebar-toggle-icon" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16M4 12h16M4 18h16"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
      </svg>
    </button>


    <nav class="admin-side-menu">
      <a th:href="@{/admin/lost}" class="active">
        <i data-lucide="panel-top"></i>
        <span>게시글 관리</span>
      </a>

      <a th:href="@{/api/admin/users}" >
        <i data-lucide="user-round"></i>
        <span>회원 관리</span>
      </a>



      <a th:href="@{/api/admin/stats}">
        <i data-lucide="bar-chart-3"></i>
        <span>통계 관리</span>
      </a>


   

    </nav>
  </aside>

  <!-- 본문 -->
  <main class="admin-main">

    <section class="admin-page-title">
      <h1>게시글 관리</h1>
      <p>분실물/습득물 게시글을 관리할 수 있습니다.</p>
    </section>

    <!-- 탭 -->
    <section class="admin-tabs">

      <a href="javascript:void(0);" 
         onclick="switchTab('lost')"
         th:classappend="${boardType == 'lost'} ? ' active'">
        분실물
      </a>

      <a href="javascript:void(0);"
         onclick="switchTab('found')"
         th:classappend="${boardType == 'found'} ? ' active'">
        습득물
      </a>

    </section>

    <!-- 필터 -->
    <section class="admin-filter-card">
      <form id="filterForm" th:action="@{/admin/{type}(type=${boardType})}" method="get" class="admin-filter-form">
        <input type="hidden" name="page" th:value="${searchVO.page}">


        <div class="filter-top">
          <div class="filter-search-wrap">
            <input type="text"
                   name="keyword"
                   th:value="${param.keyword}"
                   placeholder="제목, 내용, 작성자 검색">

            <button type="submit" class="filter-search-btn">검색</button>
          </div>

          <div class="filter-right">
            <label class="filter-chip deleted-filter">
              <input type="checkbox"
                    name="includeDeleted"
                    value="true"
                    th:checked="${searchVO.includeDeleted}">
              <span>삭제된 글만 보기</span>
          </label>        

          <button type="button" id="btnSelectAllFilters" class="filter-reset-btn">
            <i data-lucide="check-square"></i>
            <span>필터 전체선택</span>
          </button>

 


          <a th:href="@{/admin/{type}(type=${boardType})}" class="filter-reset-btn">
            <i data-lucide="rotate-cw"></i>
            <span>초기화</span>
          </a>
        </div>
        </div>

        <div class="filter-row">
          <div class="filter-label">카테고리</div>

          <div class="filter-content">
          <label class="filter-chip">
            <input type="checkbox" name="categories" value="지갑"
                   th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories, '지갑')}">
            <span>지갑</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="핸드폰"
                   th:checked="${searchVO.categories  != null and #lists.contains(searchVO.categories, '핸드폰')}">
            <span>핸드폰</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="가방"
                   th:checked="${searchVO.categories  != null and #lists.contains(searchVO.categories, '가방')}">
            <span>가방</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="카드"
                  th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories,'카드')}">
              <span>카드</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="전자기기"
                  th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories,'전자기기')}">
              <span>전자기기</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="의류"
                  th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories,'의류')}">
              <span>의류</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="귀금속"
                  th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories,'귀금속')}">
              <span>귀금속</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="도서"
                  th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories,'도서')}">
              <span>도서</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="자동차"
                  th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories,'자동차')}">
              <span>자동차</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="categories" value="기타"
                  th:checked="${searchVO.categories != null and #lists.contains(searchVO.categories,'기타')}">
              <span>기타</span>
          </label>

        </div>
        </div>

        <div class="filter-row">
          <div class="filter-label">상태</div>

          <label class="filter-chip">
            <input type="checkbox" name="doneList" value="0"
                   th:checked="${searchVO.doneList != null and #lists.contains(searchVO.doneList, 0)}">
            <span>진행중</span>
          </label>

          <label class="filter-chip">
            <input type="checkbox" name="doneList" value="1"
                   th:checked="${searchVO.doneList != null and #lists.contains(searchVO.doneList, 1)}">
            <span>완료</span>
          </label>
        </div>

        <div class="filter-row">
          <div class="filter-label">등록일</div>

          <input type="date"
                 name="startDate"
                 class="filter-date"
                 th:value="${searchVO.startDate}">

          <span class="date-separator">~</span>

          <input type="date"
                 name="endDate"
                 class="filter-date"
                 th:value="${searchVO.endDate}">

          <div class="date-shortcuts">
            <button type="button" data-range="today">오늘</button>
            <button type="button" data-range="7days">7일</button>
            <button type="button" data-range="1month">1개월</button>
            <button type="button" data-range="3months">3개월</button>
            <button type="button" data-range="all">전체</button>
          </div>
        </div>

          <div class="filter-row">
            <div class="filter-label">데이터출처</div>

            <label class="filter-chip">
                <input type="checkbox" name="dataSources" value="USER"
                th:checked="${searchVO.dataSources != null and #lists.contains(searchVO.dataSources, 'USER')}">
                <span>사용자</span>
            </label>

            <label class="filter-chip">
                <input type="checkbox" name="dataSources" value="POLICE"
                th:checked="${searchVO.dataSources != null and #lists.contains(searchVO.dataSources, 'POLICE')}">
            <span>경찰기관</span>
            </label>

            <label class="filter-chip" th:if="${boardType=='found'}">
                <input type="checkbox" name="dataSources" value="PORTAL"
                th:checked="${searchVO.dataSources != null and #lists.contains(searchVO.dataSources, 'PORTAL')}">
            <span>포털기관</span>
            </label>

            <div class="download">
              <button type="button" id="downloadBtn" class="download-btn">
                <svg class="download-icon"
                     xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                  <path d="M12 3v12"></path>
                  <path d="m7 10 5 5 5-5"></path>
                  <path d="M5 21h14"></path>
                </svg>
                <span>다운로드</span>
              </button>
            </div>
          </div>

      </form>
    </section>

    <div class="search-count" style="padding: 8px;">
      총 <span th:text="${searchVO.totalCount}">0</span>건의 자료가 검색되었습니다.
    </div>

    <!-- 선택 액션 바 -->
    <section class="admin-bulk-bar">
      <label class="bulk-check">
        <input type="checkbox" id="checkAll">
        <span>전체 선택</span>
      </label>

      <div class="bulk-selected-text">
        선택된 게시글 <strong id="selectedCount">0</strong>개
      </div>

      <div class="bulk-actions">
        <button type="button" class="bulk-stop-btn" id="bulkBlockBtn">
          <i data-lucide="circle-slash"></i>
          <span>선택 삭제</span>
        </button>

        <button type="button" class="bulk-role-btn" id="bulkRoleBtn">
          <i data-lucide="user-cog"></i>
          <span>완료 처리</span>
        </button>
      </div>
    </section>

    <!-- 회원 테이블 -->
    <section class="admin-table-card">
      <table class="user-manage-table">
        <thead>
        <tr>
          <th>
            <input type="checkbox" id="tableCheckAll">
          </th>
          <th>번호</th>
          <th>구분</th>
          <th>카테고리</th>
          <th>제목</th>
          <th>작성자</th>
          <th>등록일</th>
          <th>상태</th>
          <th>데이터 출처</th>
          <th>관리</th>
        </tr>
        </thead>

        
        <!-- 실제 DB 연결용 -->
         <!--분실물-->
         <tbody>
          <tr th:if="${boardType=='lost' and lostList!=null}" th:each="item : ${lostList}"
          class="board-row"
          th:classappend="${item.isDeleted==1} ? 'deleted-row'"
          th:data-url="@{/admin/lost/{atcId}(atcId=${item.atcId})}"
          th:attr="data-deleted=${item.isDeleted}">
          
            <td>
            <input type="checkbox"
                   class="user-check"
                   name="atcId"
                   th:value="${item.atcId}"
                   th:data-source="${item.dataSource}">
            </td>       
            <td th:text="${item.num}">번호</td>
            <td>분실물</td>
            <td th:text="${item.prdtClNm !=null ? item.prdtClNm :'-'}">카테고리</td>

            

            <td>
              <a th:href="@{/api/lost/detail/{atcId}(atcId=${item.atcId})}"
                 class="board-title"
                 th:text="${item.lstPrdtNm}">
                 제목
              </a>
            </td>


            <td th:text="${item.id !=null ? item.id :'-'}">작성자</td>
            <td th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'yyyy.MM.dd') : '-'}">
            등록일
            </td>
            <td>
              <span class="status-badge active" th:if="${item.done == 0}">진행중</span>
              <span class="status-badge dormant" th:if="${item.done == 1}">완료</span>
            </td>
            <td>
              <span class="role-badge user"
                    th:if="${item.dataSource == 'USER'}">사용자</span>

              <span class="role-badge police"
                    th:if="${item.dataSource == 'POLICE'}">경찰</span>
            
            <span class="role-badge portal"
                  th:if="${item.dataSource == 'PORTAL'}">포털</span>
            </td>
            <td class="table-actions no-row-click">
              <a th:href="@{/api/lost/detail/{atcId}(atcId=${item.atcId})}"
               class="detail-btn">상세보기</a>
              
               <form th:action="@{/admin/lost/delete(atcId=${item.atcId})}" method="post" class="single-delete-form">
                <input type="hidden" name="atcId" th:value="${item.atcId}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="stop-btn">삭제</button>
               </form> 
            </td>
          </tr>   
          
          <!--습득물-->
          <tr th:if="${boardType=='found' and foundList !=null}"
          th:each="item : ${foundList}"
          class="board-row"
          th:classappend="${item.isDeleted==1} ? 'deleted-row'"
          th:data-url="@{/admin/found/{atcId}(atcId=${item.atcId})}"
          th:attr="data-deleted=${item.isDeleted}">
          <td>
            <input type="checkbox" class="user-check" name="atcId" th:value="${item.atcId}"
            th:data-source="${item.dataSource}">
          </td>
          <td th:text="${item.num}">1256</td>
          <td>습득물</td>
          <td th:text="${item.prdtClNm != null ? item.prdtClNm : '-'}">지갑</td>

          

          <td>
            <a th:href="@{/api/found/detail/{atcId}(atcId=${item.atcId})}"
            class="board-title"
            th:text="${item.fdPrdtNm}">제목
            </a>
          </td>  

          <td th:text="${item.id != null ? item.id : '-'}">김민수</td>
          <td th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'yyyy.MM.dd') : '-'}">2025.06.29</td>
          <td>
            <span class="status-badge active" th:if="${item.done == 0}">진행중</span>
            <span class="status-badge dormant" th:if="${item.done == 1}">완료</span>
          </td>
          <td>
            <span class="role-badge user" th:if="${item.dataSource == 'USER'}">사용자</span>
            <span class="role-badge police" th:if="${item.dataSource == 'POLICE'}">경찰</span>
            <span class="role-badge portal" th:if="${item.dataSource == 'PORTAL'}">포털</span>
          </td>
          <td class="table-actions no-row-click">
            <a th:href="@{/api/found/detail/{atcId}(atcId=${item.atcId})}" class="detail-btn">상세보기</a>
            
            <form th:action="@{/admin/found/delete(atcId=${item.atcId})}" method="post" class="single-delete-form">
              <input type="hidden" name="atcId" th:value="${item.atcId}">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

              <button type="submit" class="stop-btn">삭제</button>
            </form>
          </td>
        </tr>

        <!-- 임시 화면 확인용: userList 없을 때만 출력 -->
        <tr th:if="${(boardType=='lost' and(lostList ==null or #lists.isEmpty(lostList)))or
                      (boardType=='found' and(foundList ==null or #lists.isEmpty(foundList)))}">
          <td colspan="10" style="text-align: center; padding: 25px; color: #999;">조회된 게시글 내역이 없습니다.</td>
        </tr>

        </tbody>
      </table>
      <div class="no-result" style="padding: 8px; text-align: center;"
          th:if="${searchVO.totalCount==0}">
          검색된 결과가 없습니다.
      </div>
    </section>

    <!-- 페이지네이션 -->
    <section class="admin-pagination"
    th:if="${searchVO.totalCount>0}">
      <a href="javascript:void(0);" th:if="${searchVO.startPage>1}" 
      th:onclick="|fn_goPage(${searchVO.startPage-1})|"
      class="page-btn" >
        <i data-lucide="chevron-left"></i>
      </a>
      <a href="javascript:void(0);"
      th:each="p:${#numbers.sequence(searchVO.startPage,searchVO.endPage)}" 
      th:onclick="|fn_goPage(${p})|"
      th:text="${p}" 
      th:classappend="${p==searchVO.page}?'active':''"
      class="page-btn">1</a>

      <a href="javascript:void(0);"
      th:if="${searchVO.endPage<searchVO.totalPage}" 
      th:onclick="|fn_goPage(${searchVO.endPage+1})|"
      class="page-btn">
        <i data-lucide="chevron-right"></i>
      </a>
    </section>

  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
  lucide.createIcons();

  
  function fn_goPage(pageNumber){
    const form = document.getElementById("filterForm");
    if(!form) return;

    const pageInput = form.querySelector("input[name='page']");
    if(pageInput){
      pageInput.value = pageNumber;
    }
    form.dataset.isPaging="true";
    form.submit();
  }

  //탭 이동 함수 (Form데이터 유지)
  function switchTab(type){
    const form = document.getElementById("filterForm");
    if(!form) return;

    form.action="/admin/"+type;

    const pageInput= form.querySelector("input[name='page']");
    if(pageInput){
      pageInput.value="1";// 탭 이동시 1페이지로 리셋
    }
    form.submit();
  }

  document.addEventListener("DOMContentLoaded", () => {
    const checkAll = document.getElementById("checkAll");
    const tableCheckAll = document.getElementById("tableCheckAll");
    const userChecks = document.querySelectorAll(".user-check");
    const selectedCount = document.getElementById("selectedCount");


    const bulkDeleteBtn = document.getElementById("bulkBlockBtn")
    const bulkCompleteBtn = document.getElementById("bulkRoleBtn")

    
    //날짜 관련 요소
    const startDateInput = document.querySelector("input[name='startDate']");
    const endDateInput = document.querySelector("input[name='endDate']");
    const rangeButtons = document.querySelectorAll(".date-shortcuts button");

    // 전체 선택
    const btnSelectAllFilters=document.getElementById("btnSelectAllFilters");
    const sidebarToggle = document.getElementById("sidebarToggle");
    const filterForm = document.getElementById("filterForm");
    
    //순수 검색/필터링 시 1페이지로 리셋하는 이벤트 리스너
    if(filterForm){
      filterForm.addEventListener("submit",(e)=>{
        // fn_goPage를 통한 페이징 이동이 '아닌' 모든 검색/엔터 처리일 때
        if(filterForm.dataset.isPaging !=="true"){
          const pageInput=filterForm.querySelector("input[name='page']");
          if(pageInput){
            pageInput.value="1";
          }
        }
        delete filterForm.dataset.isPaging;
      });
    }


    
    if(btnSelectAllFilters){
      btnSelectAllFilters.addEventListener("click",(e)=>{
        e.preventDefault();
        e.stopPropagation();
        // 현재 체크된 개수 파악
        const AllFilterChecks = document.querySelectorAll(
          "input[name='categories'],input[name='doneList'],input[name='dataSources']");

        const checkedCount=document.querySelectorAll(
            "input[name='categories']:checked,input[name='doneList']:checked,input[name='dataSources']:checked"
          ).length;



        // 전체가 다 체크되어 있는지 여부 확인
        const AllChecked = (AllFilterChecks.length === checkedCount);

        // 이미 다 켜져있으면 전체 해제, 하나라도 꺼져있으면 전체 체크
        AllFilterChecks.forEach(c=>{
          c.checked=!AllChecked;
        });
      });
    }

    function updateSelectedCount() {
      const checkedCount = document.querySelectorAll(".user-check:checked").length;

      selectedCount.textContent = checkedCount;

      const isAllChecked = userChecks.length > 0 && checkedCount === userChecks.length;

      if (checkAll) {
        checkAll.checked = isAllChecked;
      }

      if (tableCheckAll) {
        tableCheckAll.checked = isAllChecked;
      }
    }

    function setAllChecked(checked) {
      userChecks.forEach(check => {
        check.checked = checked;
      });

      updateSelectedCount();
    }


    if (checkAll) {
      checkAll.addEventListener("change", () => {
        setAllChecked(checkAll.checked);
      });
    }

    if (tableCheckAll) {
      tableCheckAll.addEventListener("change", () => {
        setAllChecked(tableCheckAll.checked);
      });
    }

    userChecks.forEach(check => {
      check.addEventListener("change", updateSelectedCount);
    });

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function setDateRange(range) {
      if (!startDateInput || !endDateInput) {
        return;
      }

      const today = new Date();
      const startDate = new Date(today);
      const endDate = new Date(today);

      if (range === "today") {
        // 오늘 그대로
      } else if (range === "7days") {
        startDate.setDate(today.getDate() - 7);
      } else if (range === "1month") {
        startDate.setMonth(today.getMonth() - 1);
      } else if (range === "3months") {
        startDate.setMonth(today.getMonth() - 3);
      } else if (range === "all") {
        startDateInput.value = "";
        endDateInput.value = "";
        return;
      }

      startDateInput.value = formatDate(startDate);
      endDateInput.value = formatDate(endDate);
    }

    rangeButtons.forEach(button => {
      button.addEventListener("click", () => {
        rangeButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        
        setDateRange(button.dataset.range);
      });
    });

    function restoreDateRangeActive(){
      if(!startDateInput||!endDateInput){
        return;
      }
      const startDate=startDateInput.value.trim();
      const endDate=endDateInput.value.trim();

      rangeButtons.forEach(button=>{
        button.classList.remove("active");
      });

      if(startDate===""&&endDate===""){
        rangeButtons.forEach(button=>{
          if(button.dataset.range==="all"){
            button.classList.add("active");
          }
        });
      }
    }
    restoreDateRangeActive();

    /*사이드바*/
    if(sidebarToggle){
      sidebarToggle.addEventListener("click", function (){
        document.body.classList.toggle("sidebar-collapsed");
        const isCollapsed = document.body.classList.contains("sidebar-collapsed");
        localStorage.setItem("adminSidebarCollapsed", isCollapsed);
      });
      requestAnimationFrame(()=>{
        document.body.classList.remove("sidebar-init");
      });
    }
    
    if (bulkDeleteBtn) {
      bulkDeleteBtn.addEventListener("click", () => {
        const checkedBoxes = document.querySelectorAll(".user-check:checked");
        
        if (checkedBoxes.length===0){
          alert("선택된 게시글이 없습니다")
          return;
        }
        if(!confirm("선택한 게시글을 삭제하시겠습니까?")){
          return;
        }
        
        const activeTab=document.querySelector(".admin-tabs .active").textContent.trim();
        const boardType=activeTab==="분실물"?"lost":"found";

        const form = document.createElement("form");
        form.method="post";
        form.action=`/admin/${boardType}/delete`;

        // 3. 선택된 모든 체크박스를 돌면서 번호(atcId)와 출처(dataSources)를 매칭해서 폼에 추가
        checkedBoxes.forEach(c =>{
           const input = document.createElement("input");
           input.type="hidden";
           input.name="atcId";
           input.value=c.value; 
           form.appendChild(input);
          // 각 글에 해당하는 데이터 출처(USER, POLICE, portal) hidden input
           const dataSourceInput=document.createElement("input");
           dataSourceInput.type="hidden";
           dataSourceInput.name="dataSource";
           dataSourceInput.value=c.dataset.source;// HTML의 th:data-source 값을 가져옴
           form.appendChild(dataSourceInput)
        });
        

        // csrf 토큰 추가

        const csrfToken = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        if(csrfToken){
          const csrfInput = document.createElement("input");
          csrfInput.type="hidden";
          csrfInput.name="_csrf";
          csrfInput.value=csrfToken;
          form.appendChild(csrfInput)
        }

        document.body.appendChild(form)
        form.submit();
      });
    }
    
      const singleDeleteForms= document.querySelectorAll(".single-delete-form");
      singleDeleteForms.forEach(form=>{
      form.addEventListener("submit",(e)=>{
        // confirm 창에서 '취소'를 누르면 폼 제출(삭제)막음
        if(!confirm("선택한 게시글을 삭제하시겠습니까")){
          e.preventDefault();
        }
      });
     });
    

    if (bulkCompleteBtn) {
      bulkCompleteBtn.addEventListener("click", () => {

        const checkedBoxes = document.querySelectorAll(".user-check:checked");
        
        if (checkedBoxes.length === 0) {
          alert("선택된 게시글이 없습니다.");
          return;
        }

        if (!confirm(`선택한 ${checkedBoxes.length}개의 게시글을 완료 처리하시겠습니까?`)) {
          return;
        }
        //현재 텝 판단
        const activeTab = document.querySelector(".admin-tabs .active").textContent.trim();
        const boardType = activeTab === "분실물" ? "lost" : "found";

        //form생성
        const form = document.createElement("form");
        form.method="post";
        form.action= `/admin/${boardType}/complete`;

        //선택된 게시글 id 넣기
        checkedBoxes.forEach(c=>{
          const input = document.createElement("input");
          input.type ="hidden";
          input.name="atcId";
          input.value=c.value;
          form.appendChild(input);
        })
        //csrf 토큰 추가
        const csrfToken=document.querySelector('meta[name="_csrf"]').content;
        
        const csrfInput=document.createElement("input")
        csrfInput.type="hidden";
        csrfInput.name="_csrf"
        csrfInput.value=csrfToken;

        form.appendChild(csrfInput);

        document.body.appendChild(form);
        form.submit();
      });
    }

    updateSelectedCount();
  });


</script>

</body>
