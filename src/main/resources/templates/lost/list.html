<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>분실물 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-6 text-gray-800">📋 분실물 목록</h1>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-200 text-gray-600 uppercase text-sm leading-normal">
                    <th class="py-3 px-4">번호</th>
                    <th class="py-3 px-4">제품명</th> <th class="py-3 px-4">분실장소</th>
                    <th class="py-3 px-4">날짜</th>
                    <th class="py-3 px-4">상태</th>
                </tr>
            </thead>
            <tbody class="text-gray-600 text-sm">
                <tr th:each="item : ${goodsList}" class="border-b border-gray-200 hover:bg-gray-50">
                    <td class="py-3 px-4" th:text="${item.num}"></td>
                    <td class="py-3 px-4 font-bold text-blue-600 underline">
                        <a th:href="@{/lost/detail(atcId=${item.atcId})}" th:text="${item.lstPrdtNum}"></a>
                    </td>
                    <td class="py-3 px-4" th:text="${item.lstPlace}"></td>
                    <td class="py-3 px-4" th:text="${item.lstYmd}"></td>
                    <td class="py-3 px-4">
                        <span th:class="${item.done == 0 ? 'bg-yellow-200 text-yellow-800' : 'bg-green-200 text-green-800'}" class="py-1 px-3 rounded-full text-xs" th:text="${item.done == 0 ? '미완료' : '완료'}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
