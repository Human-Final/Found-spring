<!DOCTYPE html>
<!-- 📌 핵심 교정: 타임리프 파싱 에러를 막기 위해 www. 주소를 정확히 채워 넣었습니다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 등록 - 분실물 센터</title>
  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <style>
  /* 공지사항 등록 페이지 */

  .write-container {
    width: 100%;
    max-width: 860px;
    margin: 32px auto 48px;
    padding: 0 24px;
  }

  /* 상단 타이틀 */
  .write-title {
    height: 92px;
    padding: 0 24px;
    margin-bottom: 18px;
    border-radius: 12px;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 20px;
    font-weight: 800;

    display: flex;
    align-items: center;
  }

  /* 폼 박스 */
  .write-container form {
    background: #ffffff;
    border: 1px solid #dbe3ee;
    border-radius: 12px;
    padding: 26px;
    box-shadow: 0 8px 22px rgba(15, 23, 42, 0.045);
  }

  /* 입력 그룹 */
  .form-group {
    margin-bottom: 22px;
  }

  .form-group label {
    display: block;
    margin-bottom: 9px;
    color: #334155;
    font-size: 14px;
    font-weight: 800;
  }

  /* input / textarea / file 공통 */
  .form-control {
    width: 100%;
    border: 1px solid #d8e2ef;
    border-radius: 9px;
    background: #f8fafc;
    color: #0f172a;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  input.form-control {
    height: 44px;
    padding: 0 14px;
  }

  textarea.form-control {
    min-height: 190px;
    padding: 14px;
    resize: vertical;
    line-height: 1.6;
  }

  .form-control::placeholder {
    color: #94a3b8;
  }

  .form-control:focus {
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  /* 파일 업로드 input */
  input[type="file"].form-control {
    height: auto;
    padding: 10px 12px;
    cursor: pointer;
  }

  input[type="file"].form-control::file-selector-button {
    height: 32px;
    margin-right: 12px;
    padding: 0 12px;
    border: none;
    border-radius: 7px;
    background: #2563eb;
    color: #ffffff;
    font-size: 12px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }

  input[type="file"].form-control::file-selector-button:hover {
    background: #1d4ed8;
  }

  /* 파일 안내 문구 */
  .form-group p {
    margin-top: 7px !important;
    color: #64748b !important;
    font-size: 12px !important;
    line-height: 1.5;
  }

  /* 체크박스 옵션 영역 */
  .checkbox-group {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin: 4px 0 22px;
    padding: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #f8fafc;
  }

  /* 체크박스 라벨 */
  .checkbox-label {
    min-height: 42px;
    padding: 0 12px;
    border: 1px solid #dbe3ee;
    border-radius: 9px;
    background: #ffffff;
    color: #334155;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;

    display: flex;
    align-items: center;
    gap: 9px;

    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .checkbox-label:hover {
    border-color: #93c5fd;
    background: #eff6ff;
  }

  .checkbox-label input {
    width: 16px;
    height: 16px;
    accent-color: #2563eb;
    cursor: pointer;
  }

  /* 체크된 옵션 강조 */
  .checkbox-label:has(input:checked) {
    border-color: #2563eb;
    background: #eff6ff;
    color: #1d4ed8;
  }

  /* 버튼 영역 */
  .btn-area {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #eef2f7;
  }

  /* 버튼 공통 */
  .btn {
    height: 44px;
    padding: 0 18px;
    border-radius: 9px;
    border: 1px solid transparent;
    font-size: 14px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  /* 등록 버튼 */
  .btn-submit {
    background: #2563eb;
    color: #ffffff;
  }

  .btn-submit:hover {
    background: #1d4ed8;
  }

  /* 취소 버튼 */
  .btn-cancel {
    background: #eef2f7;
    color: #334155;
    border-color: #d8e2ef;
  }

  .btn-cancel:hover {
    background: #e2e8f0;
  }

  /* 반응형 */
  @media (max-width: 768px) {
    .write-container {
      margin: 24px auto 40px;
      padding: 0 14px;
    }

    .write-title {
      height: auto;
      min-height: 76px;
      padding: 18px;
    }

    .write-container form {
      padding: 20px;
    }

    .checkbox-group,
    .btn-area {
      grid-template-columns: 1fr;
    }
  }
  </style>
</head>
<body>

  <div th:replace="layout/header :: headerFragment"></div>

  <div class="write-container">
    <div class="write-title">공지사항 등록</div>

    <form th:action="@{/notice/write}" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
      
      <!-- 제목 입력 -->
      <div class="form-group">
        <label for="title">공지 제목</label>
        <input type="text" id="title" name="title" class="form-control" placeholder="공지사항 제목을 입력하세요 (최대 100자)" maxlength="100">
      </div>

      <!-- 내용 입력 -->
      <div class="form-group">
        <label for="content">공지 내용</label>
        <textarea id="content" name="content" class="form-control" rows="12" placeholder="공지사항 내용을 입력하세요 (최대 500자)" maxlength="500"></textarea>
      </div>

      <!-- 옵션 선택 (체크박스) -->
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="isImportant" value="1">
          중요 공지로 지정 (최상단 고정)
        </label>
        
        <label class="checkbox-label">
          <input type="checkbox" name="isPlanned" value="1">
          홈 화면 팝업 띄우기 (3분 제한 작동)
        </label>
      </div>

      <!-- 이미지 파일 첨부 (단일 파일 1개) -->
      <div class="form-group">
        <label for="uploadFile">안내 이미지 첨부 (1개만 가능)</label>
        <input type="file" id="uploadFile" name="uploadFile" class="form-control" accept="image/*" onchange="checkFileSize(this)">
        <p style="font-size: 12px; color: #666; margin-top: 5px;">* 팝업 활성화 시 이미지가 있으면 이미지만 노출되며, 없으면 텍스트로 노출됩니다.</p>
      </div>

      <!-- 하단 액션 버튼 -->
      <div class="btn-area">
        <button type="submit" class="btn btn-submit">등록하기</button>
        <a th:href="@{/notice/list}" class="btn btn-cancel">취소</a>
      </div>

    </form>
  </div>

  <div th:replace="layout/footer :: footerFragment"></div>

  <!-- 조건부 유효성 검사 스크립트 수정 완료 -->
  <script>
    function validateForm() {
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        const uploadFile = document.getElementById("uploadFile").value;

        if (!title) {
            alert("공지 제목을 입력해 주세요.");
            return false;
        }
        
        // 💡 [핵심 교정]: 글 내용이 비어있더라도 '이미지 파일'을 등록했다면 통과되도록 규칙 완화
        // 글 내용도 없고, 파일도 선택하지 않았을 때만 등록을 제한합니다.
        if (!content && !uploadFile) {
            alert("공지 내용문 혹은 안내 이미지 중 하나는 반드시 입력하셔야 등록이 가능합니다.");
            return false;
        }
        return true;
    }

    function checkFileSize(fileInput) {
        if (fileInput.files && fileInput.files[0]) {
            const maxSize = 5 * 1024 * 1024; // 5MB
            if (fileInput.files[0].size > maxSize) {
                alert("파일 크기는 5MB를 초과할 수 없습니다.");
                fileInput.value = ""; 
            }
        }
    }
  </script>

</body>
</html>
