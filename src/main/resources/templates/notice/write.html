<!DOCTYPE html>
<!-- 📌 핵심 교정: 타임리프 파싱 에러를 막기 위해 www. 주소를 정확히 채워 넣었습니다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 등록 - 분실물 센터</title>
  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <style>
    .write-container { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
    .write-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: #333; border-bottom: 2px solid #333; padding-bottom: 10px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #444; font-size: 15px; }
    
    .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .form-control:focus { border-color: #007bff; outline: none; box-shadow: 0 0 5px rgba(0,123,255,0.2); }
    
    .checkbox-group { display: flex; gap: 30px; margin: 25px 0; background: #f8f9fa; padding: 15px; border-radius: 4px; border: 1px solid #e9ecef; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #444; cursor:pointer; font-size: 14px; }
    .checkbox-label input { width: 18px; height: 18px; cursor: pointer; }
    
    .btn-area { margin-top: 30px; text-align: center; display: flex; justify-content: center; gap: 15px; }
    .btn { padding: 12px 24px; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; text-decoration: none; display: inline-block; }
    .btn-submit { background-color: #007bff; color: #fff; }
    .btn-submit:hover { background-color: #0056b3; }
    .btn-cancel { background-color: #6c757d; color: #fff; }
    .btn-cancel:hover { background-color: #5a6268; }
  </style>
</head>
<body>

  <div th:replace="layout/header :: headerFragment"></div>

  <div class="write-container">
    <div class="write-title">공지사항 등록</div>

    <form th:action="@{/notice/write}" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
      
      <!-- 제목 입력 -->
      <div class="form-group">
        <label for="title">공지 제목</label>
        <input type="text" id="title" name="title" class="form-control" placeholder="공지사항 제목을 입력하세요 (최대 100자)" maxlength="100">
      </div>

      <!-- 내용 입력 -->
      <div class="form-group">
        <label for="content">공지 내용</label>
        <textarea id="content" name="content" class="form-control" rows="12" placeholder="공지사항 내용을 입력하세요 (최대 500자)" maxlength="500"></textarea>
      </div>

      <!-- 옵션 선택 (체크박스) -->
      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" name="isImportant" value="1">
          📌 중요 공지로 지정 (최상단 고정)
        </label>
        
        <label class="checkbox-label">
          <input type="checkbox" name="isPlanned" value="1">
          🔔 홈 화면 팝업 띄우기 (3분 제한 작동)
        </label>
      </div>

      <!-- 이미지 파일 첨부 (단일 파일 1개) -->
      <div class="form-group">
        <label for="uploadFile">안내 이미지 첨부 (1개만 가능)</label>
        <input type="file" id="uploadFile" name="uploadFile" class="form-control" accept="image/*" onchange="checkFileSize(this)">
        <p style="font-size: 12px; color: #666; margin-top: 5px;">* 팝업 활성화 시 이미지가 있으면 이미지만 노출되며, 없으면 텍스트로 노출됩니다.</p>
      </div>

      <!-- 하단 액션 버튼 -->
      <div class="btn-area">
        <button type="submit" class="btn btn-submit">등록하기</button>
        <a th:href="@{/notice/list}" class="btn btn-cancel">취소</a>
      </div>

    </form>
  </div>

  <div th:replace="layout/footer :: footerFragment"></div>

  <!-- 조건부 유효성 검사 스크립트 수정 완료 -->
  <script>
    function validateForm() {
        const title = document.getElementById("title").value.trim();
        const content = document.getElementById("content").value.trim();
        const uploadFile = document.getElementById("uploadFile").value;

        if (!title) {
            alert("공지 제목을 입력해 주세요.");
            return false;
        }
        
        // 💡 [핵심 교정]: 글 내용이 비어있더라도 '이미지 파일'을 등록했다면 통과되도록 규칙 완화
        // 글 내용도 없고, 파일도 선택하지 않았을 때만 등록을 제한합니다.
        if (!content && !uploadFile) {
            alert("공지 내용문 혹은 안내 이미지 중 하나는 반드시 입력하셔야 등록이 가능합니다.");
            return false;
        }
        return true;
    }

    function checkFileSize(fileInput) {
        if (fileInput.files && fileInput.files[0]) {
            const maxSize = 5 * 1024 * 1024; // 5MB
            if (fileInput.files[0].size > maxSize) {
                alert("파일 크기는 5MB를 초과할 수 없습니다.");
                fileInput.value = ""; 
            }
        }
    }
  </script>

</body>
</html>
