<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 - 분실물 센터</title>
  <!-- 기존에 사용하시던 공통 스타일시트 연동 -->
  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <style>
    
  /* 공지사항 목록 전체 */
  .notice-container {
    width: 100%;
    max-width: 1150px;
    margin: 28px auto 0;
    padding: 0 24px;
  }

  /* 상단 타이틀 영역 */
  .notice-title {
    height: 92px;
    padding: 0 22px;
    margin-bottom: 16px;
    border-radius: 12px;
    background: #dbeafe;
    color: #1d4ed8;
    font-size: 20px;
    font-weight: 800;

    display: flex;
    align-items: center;
  }

  /* 공지 테이블 */
  .notice-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: #ffffff;
    border: 1px solid #dbe3ee;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    table-layout: fixed;
  }

  /* 테이블 헤더 */
  .notice-table thead th {
    height: 44px;
    padding: 0 14px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    color: #64748b;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
  }

  /* 테이블 행 */
  .notice-table tbody tr {
    height: 56px;
    transition: background 0.15s ease;
  }

  .notice-table tbody tr:hover {
    background: #f8fafc;
  }

  /* 테이블 셀 */
  .notice-table tbody td {
    padding: 0 14px;
    border-bottom: 1px solid #eef2f7;
    color: #334155;
    font-size: 13px;
    text-align: center;
    vertical-align: middle;
  }

  .notice-table tbody tr:last-child td {
    border-bottom: none;
  }

  /* 제목 칸 */
  .notice-table .text-left {
    text-align: left;
  }

  /* 공지 제목 링크 */
  .notice-link {
    display: inline-block;
    max-width: calc(100% - 34px);
    color: #0f172a;
    font-size: 14px;
    font-weight: 700;
    vertical-align: middle;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .notice-link:hover {
    color: #2563eb;
    text-decoration: underline;
  }

  /* 중요 공지 행 */
  .row-important {
    background: #fff7ed;
  }

  .row-important:hover {
    background: #ffedd5;
  }

  /* 뱃지 공통 */
  .badge {
    height: 24px;
    padding: 0 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* 중요 뱃지 */
  .badge-important {
    background: #fee2e2;
    color: #dc2626;
  }

  /* 빈 목록 */
  .empty-row {
    height: 120px;
    color: #94a3b8 !important;
    font-size: 14px !important;
    text-align: center !important;
  }

  /* 공지 등록 버튼 영역 */
  .btn-write {
    float: right;
    height: 36px;
    margin-top: 18px;
    padding: 0 16px;
    border-radius: 9px;
    background: #2563eb;
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .btn-write:hover {
    background: #1d4ed8;
  }

  /* float 해제 */
  .clear {
    clear: both;
  }

  /* 반응형 */
  @media (max-width: 768px) {
    .notice-container {
      padding: 20px 14px 0;
    }

    .notice-title {
      height: auto;
      min-height: 76px;
      padding: 18px;
    }

    .notice-table {
      table-layout: auto;
    }

    .notice-table thead {
      display: none;
    }

    .notice-table,
    .notice-table tbody,
    .notice-table tr,
    .notice-table td {
      display: block;
      width: 100%;
    }

    .notice-table tbody tr {
      height: auto;
      padding: 14px 16px;
      border-bottom: 1px solid #eef2f7;
    }

    .notice-table tbody td {
      height: auto;
      padding: 4px 0;
      border-bottom: none;
      text-align: left;
    }

    .notice-table tbody td:first-child {
      margin-bottom: 4px;
    }

    .notice-link {
      max-width: 100%;
    }

    .btn-write {
      width: 100%;
      float: none;
    }
  }
  </style>
</head>
<body>

  <!-- 기존 사용하시던 헤더 레이아웃 탑재 -->
  <div th:replace="layout/header :: headerFragment"></div>

  <div class="notice-container">
    <div class="notice-title">공지사항</div>

    <table class="notice-table">
      <thead>
        <tr>
          <th style="width: 10%;">번호</th>
          <th style="width: 50%;">제목</th>
          <th style="width: 15%;">작성자</th>
          <th style="width: 15%;">작성일</th>
          <th style="width: 10%;">조회수</th>
        </tr>
      </thead>
      <tbody>
        <!-- 공지사항 목록 반목문 수행 (컨트롤러에서 넘겨준 "list" 활용) -->
        <tr th:each="notice : ${list}" th:classappend="${notice.isImportant == 1} ? 'row-important'">
          
          <!-- 번호 영역: 중요 공지일 때는 뱃지 노출, 일반 공지일 때는 번호 노출 -->
          <td>
            <span th:if="${notice.isImportant == 1}" class="badge badge-important">중요</span>
            <span th:unless="${notice.isImportant == 1}" th:text="${notice.num}">1</span>
          </td>
          
          <!-- 제목 영역: 클릭 시 해당 번호(num)를 가지고 상세보기로 이동 -->
          <td class="text-left">
            <a th:href="@{/api/notices/detail(num=${notice.num})}" class="notice-link" th:text="${notice.title}">
              공지사항 제목 공간입니다.
            </a>
            <!-- 이미지 아이콘 표시 (이미지가 첨부된 글일 때 소소한 클립 아이콘 노출) -->
            <span th:if="${notice.imagePath != null and notice.imagePath != ''}" style="margin-left: 5px; color: #28a745; font-size: 12px;">📁</span>
          </td>
          
          <!-- 작성자 관리자 ID -->
          <td th:text="${notice.id}">admin</td>
          
          <!-- 작성일시 포맷팅 (년.월.일 형식 출력) -->
          <td th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd')}">2026.06.19</td>
          
          <!-- 조회수 -->
          <td th:text="${notice.viewCount}">0</td>
        </tr>
        
        <!-- 게시글이 단 하나도 없을 때 보여줄 예외 처리 -->
        <tr th:if="${list == null or #lists.isEmpty(list)}">
          <td colspan="5" class="empty-row">등록된 공지사항이 존재하지 않습니다.</td>
        </tr>
      </tbody>
    </table>

    <!-- 📄 [추가] 페이징 네비게이션 영역 (중앙 정렬 배정) -->
    <div th:if="${paging != null and paging.totalCount > 0}" style="margin: 30px 0 10px 0; display: flex; justify-content: center; font-family: sans-serif;">
      <ul style="display: flex; list-style: none; padding: 0; margin: 0; gap: 6px; align-items: center;">
        
        <!-- [처음으로] 버튼 -->
        <li th:if="${paging.page > 1}">
          <a th:href="@{/api/notices/list(page=1)}" style="display: block; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #64748b; font-size: 13px;">&lt;&lt;</a>
        </li>

        <!-- [이전] 버튼 블록 -->
        <li th:if="${paging.prev}">
          <a th:href="@{/api/notices/list(page=${paging.startPage - 1})}" style="display: block; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #64748b; font-size: 13px;">이전</a>
        </li>

        <!-- [숫자 페이지 번호] 루프 -->
        <li th:each="p : ${#numbers.sequence(paging.startPage, paging.endPage)}">
          <!-- 현재 페이지 활성화 스타일 -->
          <span th:if="${p == paging.page}" 
                th:text="${p}" 
                style="display: block; padding: 6px 12px; background: #2563eb; color: #ffffff; border: 1px solid #2563eb; border-radius: 4px; font-weight: bold; font-size: 13px;">1</span>
          
          <!-- 일반 페이지 마우스 호버 효과 링크 -->
          <a th:unless="${p == paging.page}" 
             th:href="@{/api/notices/list(page=${p})}" 
             th:text="${p}" 
             style="display: block; padding: 6px 12px; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #334155; font-size: 13px; transition: background 0.2s;"
             onmouseover="this.style.background='#f1f5f9'" 
             onmouseout="this.style.background='transparent'">2</a>
        </li>

        <!-- [다음] 버튼 블록 -->
        <li th:if="${paging.next}">
          <a th:href="@{/api/notices/list(page=${paging.endPage + 1})}" style="display: block; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #64748b; font-size: 13px;">다음</a>
        </li>

        <!-- [맨끝으로] 버튼 -->
        <li th:if="${paging.page < paging.totalPage}">
          <a th:href="@{/api/notices/list(page=${paging.totalPage})}" style="display: block; padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 4px; text-decoration: none; color: #64748b; font-size: 13px;">&gt;&gt;</a>
        </li>
        
      </ul>
    </div>

    <!-- 📌 권한 분리 핵심: 세션의 userRole이 MANAGER이거나 ADMIN일 때만 [글쓰기] 버튼을 노출시킴 -->
    <div th:if="${#authorization.expression('hasAnyAuthority(''ROLE_ADMIN'', ''ROLE_MANAGER'')')}">
        <a th:href="@{/api/notices/write}" class="btn-write">공지 등록</a>
    </div>
    <div class="clear"></div>
  </div>

  <!-- 기존 사용하시던 푸터 레이아웃 탑재 -->
  <div th:replace="layout/footer :: footerFragment"></div>

</body>

</html>
