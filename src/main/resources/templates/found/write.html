<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/board/write.css}">
  
  <title>게시글 작성 | 분실물 센터</title>

</head>
<body>
 <!-- <div th:replace="layout/header :: headerFragment"></div>-->

  <main class="page">
    <section class="write-card">
      <a href="javascript:history.back()" class="back-link">← 돌아가기</a>
      <h1 class="page-title">게시글 작성</h1>

      <form
        id="postForm"
        th:action="${isEdit == true
          ? (boardType == 'lost' ? '/api/lost/update' : '/api/found/update')
          : (boardType == 'lost' ? '/api/lost' : '/api/found')}"
        method="post"
        enctype="multipart/form-data"
        th:data-is-edit="${isEdit == true}"
        th:data-board-type="${boardType}"
        data-found-action="/api/found"
        data-lost-action="/api/lost"
        data-found-update-action="/api/found/update"
        data-lost-update-action="/api/lost/update">       

        <input type="hidden"
               th:if="${isEdit == true}"
               name="atcId" 
               th:value="${boardType == 'lost' and lostVO != null 
                ? lostVO.atcId 
                : (foundVO != null ? foundVO.atcId : '')}">

        <input type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}">
        <div class="form-section">
          <span class="form-label">게시판 선택 <span class="required-mark">*</span></span>

          <div class="board-selector">
            <label class="radio-card"
            th:classappend="${isEdit and boardType == 'lost'}?'disabled':''">
              <input type="radio" name="boardType" value="FOUND" 
                th:checked="${boardType == null or boardType == 'found'}" 
                th:disabled= "${isEdit and boardType == 'lost'}" required>
              <span class="radio-dot found" aria-hidden="true"></span>
              <span>습득물 등록</span>
            </label>

            <label class="radio-card lost-card"
            th:classappend="${isEdit and boardType == 'found'}?'disabled':''">
              <input type="radio" name="boardType" value="LOST" 
                     th:checked="${boardType == 'lost'}" 
                     th:disabled= "${isEdit and boardType =='found'}"required>
              <span class="radio-dot lost" aria-hidden="true"></span>
              <span>분실물 등록</span>
            </label>
          </div>
        </div>

        <div class="form-section">
          <span class="form-label">카테고리 <span class="required-mark">*</span></span>

          <div class="category-list">
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="가방" checked required>
                <span>가방</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="귀금속" required>
                <span>귀금속</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="도서" required>
                <span>도서</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="의류" required>
                <span>의류</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="자동차" required>
                <span>자동차</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="핸드폰" required>
                <span>핸드폰</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="전자기기" required>
                <span>전자기기</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="지갑" required>
                <span>지갑</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="카드" required>
                <span>카드</span>
            </label>
            <label class="category-chip">
                <input type="radio" name="prdtClNm" value="기타" required>
                <span>기타</span>
            </label>
          </div>          

        </div>

        <div class="form-section">
          <label for="title" class="form-label">물품명
            <span class="required-mark">*</span>
          </label>
          <input
            type="text"
            id="title"
            name="fdPrdtNm"
            th:value="${isEdit == true
              ? (boardType == 'lost' ? lostVO.lstPrdtNm : foundVO.fdPrdtNm)
              : ''}"
            class="form-control title-input"
            placeholder="습득/분실하신 물건을 입력하세요"
            required
          >
        </div>

        <div id="colorSection" class="form-section">

          <label class="form-label">색상명</label>

          <input 
              type="text"
              id="color"
              name="clrNm"
              th:value="${isEdit == true 
                 ? (boardType == 'lost' ? '' : foundVO.clrNm)
                  : ''}"
              class="form-control title-input"
              placeholder="예) 검정, 흰색, 파랑"
               maxlength="30">

        </div>



        <div class="form-section">
            <label for="occurredAt" class="form-label">
              <span id="dateLabel">습득일자 </span>
              <span class="required-mark">*</span>
            </label>

            <!-- 사용자가 보는 날짜 입력 칸-->
            <input
                type="date"
                id="occurredDate"
                th:value="${isEdit == true
                    ? (boardType == 'lost' 
                        ? #temporals.format(lostVO.lstYmd, 'yyyy-MM-dd') 
                        : #temporals.format(foundVO.fdYmd, 'yyyy-MM-dd'))
                    : ''}"
                class="form-control title-input"
                required>

            <!-- 서버로 실제 전송되는 LocalDateTime 값 : 시간 포함-->
            <input
              type="hidden"
              id="occurredAt"
              name="fdYmd">

        </div>

        <div class="form-section">
          <label for="depPlace" class="form-label">
            <span id="placeLabel">습득지역 </span>
            <span class="required-mark">*</span>
          </label>

          <input
            type="text"
            id="depPlace"
            name="depPlace"
            th:value="${isEdit == true
              ? (boardType == 'lost' ? lostVO.lstPlace : foundVO.depPlace)
              : ''}"
            class="form-control title-input"
            required
            placeholder="장소명이나 건물명으로 입력 가능">
        </div>

        <div class="form-section">
          <label for="content" class="form-label">내용 
            <span class="required-mark">*</span>
          </label>
          <textarea
            id="content"
            name="fdSbjt"
            th:text="${isEdit == true
              ? (boardType == 'lost' ? lostVO.lstSbjt : foundVO.fdSbjt)
              : ''}"
            class="form-control content-textarea"
            placeholder="분실/습득 장소, 시간, 물건 특징 등을 자세히 적어주세요"
            required>
          </textarea>
        </div>

        <div class="existing-files">
          
          <h3 th:if="${isEdit == true}" >기존 첨부파일</h3>

          <div id="previewContainer" class="file-grid">

          <!--습득 수정 첨부파일-->
          <div th:if="${boardType == 'found' and foundVO != null}"
                      th:each="file : ${foundVO?.fileList}"
                      class="file-item"
                      th:data-file="${file.saveName}"
                      th:data-original="${file.fdFilepathImg}">


                <img th:src="@{'/images/found/' + ${file.saveName}}"
                     th:alt="${file.fdFilepathImg}">  

                <span th:text="${file.fdFilepathImg}"></span>

                <button type="button" class="delete-file-btn">
                  ✕
                </button>

              
          </div>
          
           <!--분실 수정 첨부파일-->
          <div th:if="${boardType == 'lost' and lostVO != null}"
                th:each="file : ${lostVO?.fileList}"
                class="file-item"
                th:data-file="${file.saveName}"
                th:data-original="${file.lstFilepathImg}">

            


                <img th:src="@{'/images/lost/' + ${file.saveName}}"
                     th:alt="${file.lstFilepathImg}">

                <span th:text="${file.lstFilepathImg}"></span>

                <button type="button" class="delete-file-btn">
                  ✕
                </button>
        
          
          </div>
          </div>
        </div> 

        <div id="deleteFilesContainer"></div>

        <div class="form-section">
          <span class="form-label">첨부파일</span>
          <label class="upload-box" id="uploadBox">
            <input type="file" id="fileUpload" name="files" multiple>
            
            <span>
              <span class="upload-icon" aria-hidden="true">↥</span>
              <p class="upload-main">파일을 드래그하거나 클릭하여 업로드</p>
              <p class="upload-sub">이미지, PDF, 문서 등</p>
              <p class="file-name" id="fileName"></p>
            </span>
          </label>
          
          

        <div class="form-actions">
          <button type="button" class="action-button cancel-button" onclick="history.back()">
            취소
          </button>
          <button type="submit" class="action-button submit-button"
                  th:text="${isEdit == true ? '수정하기' : '등록하기'}">
            등록하기
          </button>
        </div>
      </form>
    </section>
  </main>

  <div th:replace="layout/footer :: footerFragment"></div>

  <button type="button" class="help-button" aria-label="도움말">?</button>

  <script>
    const postForm = document.querySelector("#postForm");
    const boardTypeInputs = document.querySelectorAll("input[name='boardType']");
    const titleInput = document.querySelector("#title");
    const contentInput = document.querySelector("#content");
    const occurredDateInput = document.querySelector("#occurredDate");
    const occurredAtInput = document.querySelector("#occurredAt");
    const dateLabel = document.querySelector("#dateLabel");
    const uploadBox = document.querySelector("#uploadBox");
    const fileUpload = document.querySelector("#fileUpload");
    const fileName = document.querySelector("#fileName");
    const placeInput = document.querySelector("#depPlace");
    const colorSection = document.querySelector("#colorSection");

    let selectedFiles=[];

    const previewContainer = document.querySelector("#previewContainer");

    let existingFiles = [];

    document.querySelectorAll(".file-item[data-original]").forEach(item=>{

        existingFiles.push(item.dataset.original);
    });

    console.log("기존 파일:", existingFiles);

    function isDuplicate(file){

      console.log("검사 파일:", file.name);
      console.log("기존 파일 목록:", existingFiles);

      // 기존 파일 검사
      if(existingFiles.includes(file.name)){
          console.log("기존 이미지 중복");
          return true;
          }

          // 새로 선택한 파일 검사
          return selectedFiles.some(f =>
              f.name === file.name &&
              f.size === file.size
          );
      }
    
    function createPreview(file){

    const div=document.createElement("div");

    div.className="file-item";
    

    const img=document.createElement("img");

    img.src=URL.createObjectURL(file);


    const span=document.createElement("span");

    span.textContent=file.name;


    const btn=document.createElement("button");

    btn.type="button";
    btn.className="delete-file-btn";
    btn.innerHTML="✕";


    btn.onclick=function(){

        // 새로 추가한 이미지 삭제
        selectedFiles = selectedFiles.filter(f => f !== file);



        // 미리보기 화면 제거
        div.remove();


        // 파일명 표시 갱신
        updateFileName();

    };


    div.appendChild(img);
    div.appendChild(span);
    div.appendChild(btn);

     console.log("추가 위치:", previewContainer);
    previewContainer.appendChild(div);
}

    function changeFormAction() {
      const checkedBoardType = document.querySelector("input[name='boardType']:checked");

      if (!checkedBoardType) {
        return;
      }

      const isLost = checkedBoardType.value === "LOST";
      const isEdit = postForm.dataset.isEdit === "true";

      // 전송 주소 변경
      if(isEdit){
        postForm.action = isLost 
          ? postForm.dataset.lostUpdateAction
          : postForm.dataset.foundUpdateAction;
      }else{
        postForm.action = isLost
          ? postForm.dataset.lostAction
          : postForm.dataset.foundAction;
      }

      // VO 필드명 변경
      titleInput.name = isLost
        ? "lstPrdtNm"
        : "fdPrdtNm";

      contentInput.name = isLost
        ? "lstSbjt"
        : "fdSbjt";

      occurredAtInput.name = isLost
        ? "lstYmd"
        : "fdYmd"

      // 화면 문구 변경
      dateLabel.textContent = isLost
        ? "분실일자"
        : "습득일자";

      placeInput.name = isLost
        ? "lstPlace"
        : "depPlace"

        if(isLost){

        colorSection.classList.add("hidden");

        }else{

        colorSection.classList.remove("hidden");

        }
    }

    

    postForm.addEventListener("submit", function (event){
      changeFormAction();

      if(!occurredDateInput.value){
        event.preventDefault();
        alert("날짜를 선택해주세요.")
        occurredDateInput.focus();
        return;
      }

      occurredAtInput.value = occurredDateInput.value + "T00:00";

      console.log("submit action:", postForm.action);
      console.log("date name:", occurredAtInput.name);
      console.log("date value:", occurredAtInput.value);      

    });

    
    function updateFileName() {
        
        if (selectedFiles.length === 0) {
        fileName.textContent = "";
        return;
        }

        fileName.textContent = selectedFiles.length === 1
        ? selectedFiles[0].name
        : selectedFiles[0].name + " 외 " + (selectedFiles.length - 1) + "개";
    }

    boardTypeInputs.forEach(function (input) {
        input.addEventListener("change", changeFormAction);
    });

    changeFormAction();

    fileUpload.addEventListener("change", function(){


    Array.from(fileUpload.files).forEach(file=>{

      
        if(isDuplicate(file)){
            alert(file.name+" 은 이미 등록된 파일입니다.");
            return;
        }


        selectedFiles.push(file);

        console.log(previewContainer);
        createPreview(file);

    });


const dt=new DataTransfer();


selectedFiles.forEach(file=>{
    dt.items.add(file);
});


fileUpload.files=dt.files;


updateFileName();


});



    uploadBox.addEventListener("dragover", function (event) {
        event.preventDefault();
        uploadBox.classList.add("drag-over");
    });

    uploadBox.addEventListener("dragleave", function () {
        uploadBox.classList.remove("drag-over");
    });

    uploadBox.addEventListener("drop", function (event) {
       
        event.preventDefault();
        uploadBox.classList.remove("drag-over");

        Array.from(event.dataTransfer.files).forEach(file=>{

          if(isDuplicate(file)){
          alert(file.name+" 은 이미 등록된 파일입니다.");
          return;
          }


          selectedFiles.push(file);
          createPreview(file);
        });
        const dt =new DataTransfer();

        selectedFiles.forEach(file=>dt.items.add(file));

        fileUpload.files=dt.files;
        updateFileName();
    });

    document.querySelectorAll(".delete-file-btn").forEach(btn=>{
      btn.addEventListener("click",function(){

        const item =this.closest(".file-item");
        const fileName = item.dataset.file;

        if(item.classList.contains("delete-pending")){
          //취소
          item.classList.remove("delete-pending");

          const hidden = document.querySelector(
            `input[name="deleteFiles"][value="${fileName}"]`
          );
          if(hidden){
            hidden.remove();
          }
          this.innerHTML ="✕";
        }else{

          item.classList.add("delete-pending");


          const input =document.createElement("input");
          input.type="hidden";
          input.name="deleteFiles";
          input.value=fileName;

          document.getElementById("deleteFilesContainer").appendChild(input);

          this.innerHTML ="↩";
        }
      });
    });
    

    function setMaxDate(){
      const now = new Date();
      const localToday = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 10);

        occurredDateInput.max = localToday;
    }

    setMaxDate();




  </script>
</body>
</html>
