<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>습득 게시판</title>

  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/board/list.css}">
</head>

<body class="found-board">

<div th:replace="layout/header :: headerFragment"></div>

<main class="board-page">
  <section class="board-hero found">
    <div>
      <h2>습득 게시판</h2>
      <p>습득한 물건을 등록하고 주인을 찾아주세요</p>
    </div>

    <a th:href="@{/api/write(boardType='found')}" class="write-btn">글쓰기</a>
  </section>

  <section class="filter-box-advanced" 
         style="background: #f7fcf9; padding: 25px; border-radius: 12px; margin-bottom: 30px; border: 1px solid #d4f0df; box-shadow: 0 4px 12px rgba(212, 240, 223, 0.2);">
    
    <form id="advancedSearchForm" onsubmit="return false;" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
      
      <!-- [1층 - 1열] 대분류 카테고리 -->
      <div class="form-group">
        <label for="mainCategorySelect" style="font-weight: 600; display: block; margin-bottom: 8px; color: #444;">물품 분류 (대분류)</label>
        <select id="mainCategorySelect" style="width: 100%; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; cursor: pointer; box-sizing: border-box;">
          <option value="">대분류 선택</option>
          <option value="가방" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '가방')}">가방</option>
          <option value="귀금속" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '귀금속')}">귀금속</option>
          <option value="도서" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '도서')}">도서</option>
          <option value="의류" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '의류')}">의류</option>
          <option value="자동차" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '자동차')}">자동차</option>
          <option value="핸드폰" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '핸드폰')}">핸드폰</option>
          <option value="전자기기" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '전자기기')}">전자기기</option>
          <option value="지갑" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '지갑')}">지갑</option>
          <option value="카드" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '카드')}">카드</option>
          <option value="기타" th:selected="${selectedCategories != null and #lists.contains(selectedCategories, '기타')}">기타</option>
        </select>
      </div>

      <!-- [1층 - 2열] 소분류 카테고리 -->
      <div class="form-group">
        <label for="subCategorySelect" style="font-weight: 600; display: block; margin-bottom: 8px; color: #444;">물품 분류 (소분류)</label>
        <select id="subCategorySelect" style="width: 100%; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; cursor: pointer; box-sizing: border-box;">
          <option value="">소분류 선택</option>
        </select>
      </div>

      <!-- [1층 - 3열] 색상 선택 -->
      <div class="form-group">
        <label for="colorSelect" style="font-weight: 600; display: block; margin-bottom: 8px; color: #444;">색상 선택</label>
        <select id="colorSelect" style="width: 100%; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; cursor: pointer; box-sizing: border-box;">
          <option value="">물건의 색상 선택</option>
          <option value="그레이(암회)" th:selected="${colorSelected  == '그레이(암회)'}">그레이(암회)</option>
          <option value="그레이(회)" th:selected="${colorSelected  == '그레이(회)'}">그레이(회)</option>
          <option value="그린(초록)" th:selected="${colorSelected  == '그린(초록)'}">그린(초록)</option>
          <option value="네온그린(형광초록)" th:selected="${colorSelected  == '네온그린(형광초록)'}">네온그린(형광초록)</option>
          <option value="다크레드(진빨강)" th:selected="${colorSelected  == '다크레드(진빨강)'}">다크레드(진빨강)</option>
          <option value="다크바이올렛(진보라)" th:selected="${colorSelected  == '다크바이올렛(진보라)'}">다크바이올렛(진보라)</option>
          <option value="다크블루(어두운파랑)" th:selected="${colorSelected  == '다크블루(어두운파랑)'}">다크블루(어두운파랑)</option>
          <option value="다크시안(어두운청록)" th:selected="${colorSelected  == '다크시안(어두운청록)'}">다크시안(어두운청록)</option>
          <option value="다크오렌지(어두운오렌지)" th:selected="${colorSelected  == '다크오렌지(어두운오렌지)'}">다크오렌지(어두운오렌지)</option>
          <option value="다크핑크(진분홍)" th:selected="${colorSelected  == '다크핑크(진분홍)'}">다크핑크(진분홍)</option>
          <option value="딥스카이블루(새파란하늘)" th:selected="${colorSelected  == '딥스카이블루(새파란하늘)'}">딥스카이블루(새파란하늘)</option>
          <option value="라이트그레이(옅은회)" th:selected="${colorSelected  == '라이트그레이(옅은회)'}">라이트그레이(옅은회)</option>
          <option value="라임(라임)" th:selected="${colorSelected  == '라임(라임)'}">라임(라임)</option>
          <option value="라임그린(어두운청록)" th:selected="${colorSelected  == '라임그린(어두운청록)'}">라임그린(어두운청록)</option>
          <option value="레드(빨강)" th:selected="${colorSelected  == '레드(빨강)'}">레드(빨강)</option>
          <option value="레드(연한레드)" th:selected="${colorSelected  == '레드(연한레드)'}">레드(연한레드)</option>
          <option value="레드(연한빨강)" th:selected="${colorSelected  == '레드(연한빨강)'}">레드(연한빨강)</option>
          <option value="로열블루(밝은남)" th:selected="${colorSelected  == '로열블루(밝은남)'}">로열블루(밝은남)</option>
          <option value="마젠타(자홍)" th:selected="${colorSelected  == '마젠타(자홍)'}">마젠타(자홍)</option>
          <option value="바이올렛(보라)" th:selected="${colorSelected  == '바이올렛(보라)'}">바이올렛(보라)</option>
          <option value="브라운(갈)" th:selected="${colorSelected  == '브라운(갈)'}">브라운(갈)</option>
          <option value="블랙(검정)" th:selected="${colorSelected  == '블랙(검정)'}">블랙(검정)</option>
          <option value="블루(어두운파랑)" th:selected="${colorSelected  == '블루(어두운파랑)'}">블루(어두운파랑)</option>
          <option value="블루(파랑)" th:selected="${colorSelected == '블루(파랑)'}">블루(파랑)</option>
          <option value="블루바이올렛(남보라)" th:selected="${colorSelected == '블루바이올렛(남보라)'}">블루바이올렛(남보라)</option>
          <option value="샤르트뢰즈(역녹)" th:selected="${colorSelected == '샤르트뢰즈(역녹)'}">샤르트뢰즈(역녹)</option>
          <option value="스트롱시안(진한청록)" th:selected="${colorSelected == '스트롱시안(진한청록)'}">스트롱시안(진한청록)</option>
          <option value="시안(청록)" th:selected="${colorSelected == '시안(청록)'}">시안(청록)</option>
          <option value="실버(은)" th:selected="${colorSelected == '실버(은)'}">실버(은)</option>
          <option value="씨그린(노르스름한녹)" th:selected="${colorSelected == '씨그린(노르스름한녹)'}">씨그린(노르스름한녹)</option>
          <option value="알리자린(홍)" th:selected="${colorSelected == '알리자린(홍)'}">알리자린(홍)</option>
          <option value="에메랄드(선녹)" th:selected="${colorSelected == '에메랄드(선녹)'}">에메랄드(선녹)</option>
          <option value="엘로우(노랑)" th:selected="${colorSelected == '엘로우(노랑)'}">엘로우(노랑)</option>
          <option value="엘로우(밝은노랑)" th:selected="${colorSelected == '엘로우(밝은노랑)'}">엘로우(밝은노랑)</option>
          <option value="오렌지(선명한오렌지)" th:selected="${colorSelected == '오렌지(선명한오렌지)'}">오렌지(선명한오렌지)</option>
          <option value="오렌지(연한오렌지)" th:selected="${colorSelected == '오렌지(연한오렌지)'}">오렌지(연한오렌지)</option>
          <option value="오렌지(주황)" th:selected="${colorSelected == '오렌지(주황)'}">오렌지(주황)</option>
          <option value="올리브(녹갈)" th:selected="${colorSelected == '올리브(녹갈)'}">올리브(녹갈)</option>
          <option value="코럴(산호)" th:selected="${colorSelected == '코럴(산호)'}">코럴(산호)</option>
          <option value="코발트(밝은남)" th:selected="${colorSelected == '코발트(밝은남)'}">코발트(밝은남)</option>
          <option value="코발트(짙은청록)" th:selected="${colorSelected == '코발트(짙은청록)'}">코발트(짙은청록)</option>
          <option value="터키오이스(옥)" th:selected="${colorSelected == '터키오이스(옥)'}">터키오이스(옥)</option>
          <option value="퓨시아(자홍)" th:selected="${colorSelected == '퓨시아(자홍)'}">퓨시아(자홍)</option>
          <option value="피치오렌지(오렌지)" th:selected="${colorSelected == '피치오렌지(오렌지)'}">피치오렌지(오렌지)</option>
          <option value="핑크(분홍)" th:selected="${colorSelected == '핑크(분홍)'}">핑크(분홍)</option>
          <option value="핑크(선명한분홍)" th:selected="${colorSelected == '핑크(선명한분홍)'}">핑크(선명한분홍)</option>
          <option value="핑크(연한핑크)" th:selected="${colorSelected == '핑크(연한핑크)'}">핑크(연한핑크)</option>
          <option value="화이트(흰)" th:selected="${colorSelected == '화이트(흰)'}">화이트(흰)</option>
          <option value="기타" th:selected="${colorSelected == '기타'}">기타</option>
        </select>
      </div>

      <!-- [2층 - 1열] 습득자명 -->
      <div class="form-group">
        <label for="authorInput" style="font-weight: 600; display: block; margin-bottom: 8px; color: #555;">습득자명 (작성자ID)</label>
        <input type="text" id="authorInput" th:value="${selectedAuthor}" placeholder="작성자명 입력..." 
               style="width: 100%; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; box-sizing: border-box;">
      </div>

      <!-- [2층 - 2열] 진행 상태 -->
      <div class="form-group">
        <label for="statusSelect" style="font-weight: 600; display: block; margin-bottom: 8px; color: #555;">진행 상태</label>
        <select id="statusSelect" style="width: 100%; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; cursor: pointer; box-sizing: border-box;">
          <option value="" th:selected="${selectedStatus == null || selectedStatus == ''}">전체</option>
          <option value="진행중" th:selected="${selectedStatus == '진행중'}">진행중</option>
          <option value="완료" th:selected="${selectedStatus == '완료'}">완료</option>
        </select>
      </div>

      <!-- [2층 - 3열] 습득물명 -->
      <div class="form-group">
        <label for="keywordInput" style="font-weight: 600; display: block; margin-bottom: 8px; color: #555;">물품명</label>
        <input type="text" id="keywordInput" th:value="${keyword}" placeholder="습득물명 입력..." 
               style="width: 100%; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; box-sizing: border-box;">
      </div>

      <!-- [3층 - 전체] 습득일자 범위 (전체 3열을 가로로 길게 배치하여 가시성 확보) -->
      <div class="form-group" style="grid-column: span 3; display: flex; flex-direction: column;">
        <label style="font-weight: 600; display: block; margin-bottom: 8px; color: #555;">습득일자 범위</label>
        <div style="display: flex; gap: 12px; align-items: center;">
          <input type="date" id="startDateInput" th:value="${startDate}" 
                 th:max="${#calendars.format(#calendars.createNow(), 'yyyy-MM-dd')}"
                 style="flex: 1; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; box-sizing: border-box;">
          <span style="color: #999; font-weight: bold;">~</span>
          <input type="date" id="endDateInput" th:value="${endDate}" 
                 th:max="${#calendars.format(#calendars.createNow(), 'yyyy-MM-dd')}"
                 style="flex: 1; height: 42px; padding: 10px; border: 1px solid #bce6cc; border-radius: 6px; background-color: #ffffff; color: #333; outline: none; box-sizing: border-box;">
        </div>
      </div>

      <!-- [4층] 하단 버튼 그룹 -->
      <div class="form-group" style="grid-column: 1 / -1; display: flex; justify-content: center; gap: 12px; margin-top: 15px;">
        <button type="button" id="resetBtn" 
                style="background: #ffffff; color: #27ae60; padding: 12px 35px; border: 1px solid #bce6cc; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: all 0.2s;"
                onmouseover="this.style.background='#edfcf2'" onmouseout="this.style.background='#ffffff'">
          🔄 초기화
        </button>

        <button type="button" id="searchSubmitBtn" 
                style="background: #2ecc71; color: white; padding: 12px 45px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px; transition: background 0.2s;"
                onmouseover="this.style.background='#27ae60'" onmouseout="this.style.background='#2ecc71'">
          🔍 검색하기
        </button>
      </div>

    </form>
</section>

  
  <div class="count-sort">
    <p th:text="|총 ${paging.totalCount}건|" class="total-count">총 2건</p>    
    <select class="sort-select" id="sortSelect">
      <option value="latest">최신순</option>
      <option value="oldest">오래된순</option>
    </select>
  </div>

  <section class="post-grid">
    <a 
      th:each="foundVO : ${getList}"
      th:href="@{/api/found/detail/{atcId}(atcId=${foundVO.atcId})}"
      class="post-card">

      <div class="post-top">
        <div class="tag-group">
          <span class="type-tag found">습득</span>
          <span th:text="${foundVO.prdtClNm}" class="category-tag">카테고리</span>
        </div>
        <span class="status-tag"
          th:classappend="${foundVO.done == 1 ? 'status-tag-done' : 'status-tag-progress'}"
          th:text="${foundVO.done == 1 ? '✓ 완료' : '○ 진행중'}">
          상태
        </span>
      </div>

      <h4 th:text="${foundVO.fdPrdtNm}" class="post-title">제목</h4>
      <p th:text="${foundVO.fdSbjt}" 
         th:title="${foundVO.fdSbjt}"
         class="post-desc">글 내용</p>

      <div class="post-divider"></div>

      <div class="post-info">
        <div class="info-item">
          <strong>물품명</strong>
          <p th:text="${foundVO.fdPrdtNm}">물품명</p>
        </div>
        <div class="info-item">
          <strong>색상명</strong>
          <p th:text="${foundVO.clrNm != null and foundVO.clrNm != '' ? foundVO.clrNm : '미지정'}">색상명</p>
        </div>
        <div class="info-item">
          <strong>습득지역</strong>
          <p th:text="${foundVO.depPlace}">습득지역</p>
        </div>
        <div class="info-item">
          <strong>습득일자</strong>
          <p th:text="${foundVO.fdYmd != null ? #temporals.format(foundVO.fdYmd, 'yyyy-MM-dd') : ''}">습득일자</p>
        </div>
        <div class="info-item">
          <strong>물품분류</strong>
          <p th:text="${foundVO.prdtClNm}">물품분류</p>
        </div>
        <div class="info-item">
          <strong>작성자</strong>
          <p th:text="${foundVO.id != null and foundVO.id != '' ? foundVO.id : foundVO.depPlace}">작성자</p>
        </div>                
      </div>
      <div class="post-bottom">
        <div>
        <span>작성날짜 : </span>
        <span th:text="${foundVO.createdAt != null ? #temporals.format(foundVO.createdAt, 'yyyy-MM-dd') : ''}">작성날짜</span>
        </div>
        <div class="post-counts">
          <span>
            조회 수 : <span th:text="${foundVO.viewCount !=null ? foundVO.viewCount+'회' : '0회'}"></span>            
          </span>
          <span>
            댓글 수 : <span th:text="${foundVO.commentCount !=null ? foundVO.commentCount+'개' : '0개'}"></span>
          </span>
          <span>
            채팅 수 : <span th:text="${foundVO.chatCount !=null ? foundVO.chatCount+'개' : '0개'}"></span>
          </span>
        </div>
      </div>
    </a>
  </section>
  
  <div class="pagination" th:if="${paging.totalCount > 0}">
    
    <!-- 1. [이전] 버튼 교정 -->
    <a th:if="${paging.prev}"
      th:href="@{/api/found(
          page=${paging.startPage - 1},
          sort=${sort},
          category=${selectedCategories},
          subCategory=${selectedSubCategory},
          colorSelect=${colorSelected},
          startDate=${startDate},
          endDate=${endDate},
          author=${selectedAuthor},
          status=${selectedStatus},
          keyword=${keyword}
      )}"
      class="page-btn">
      이전
    </a>

    <!-- 2. [페이지 번호 숫자들] 교정 (🌟핵심 부위) -->
    <a th:each="pageNum : ${#numbers.sequence(paging.startPage, paging.endPage)}"
      th:href="@{/api/found(
          page=${pageNum},
          sort=${sort},
          category=${selectedCategories},
          subCategory=${selectedSubCategory},
          colorSelect=${colorSelected},
          startDate=${startDate},
          endDate=${endDate},
          author=${selectedAuthor},
          status=${selectedStatus},
          keyword=${keyword}
      )}"
      th:text="${pageNum}"
      th:classappend="${pageNum == paging.page} ? 'active' : ''"
      class="page-btn">
      1
    </a>

    <!-- 3. [다음] 버튼 교정 -->
    <a th:if="${paging.next}"
      th:href="@{/api/found(
          page=${paging.endPage + 1},
          sort=${sort},
          category=${selectedCategories},
          subCategory=${selectedSubCategory},
          colorSelect=${colorSelected},
          startDate=${startDate},
          endDate=${endDate},
          author=${selectedAuthor},
          status=${selectedStatus},
          keyword=${keyword}
      )}"
      class="page-btn">
      다음
    </a>

  </div>

</main>

<div th:replace="layout/footer :: footerFragment"></div>

<script th:inline="javascript">
/*<![CDATA[*/
  // 1. 현재 주소창의 파라미터 상태 읽기 및 초기화
  const currentParams = new URLSearchParams(window.location.search);

  const mainSelect = document.getElementById("mainCategorySelect");
  const subSelect = document.getElementById("subCategorySelect");
  const colorSelect = document.getElementById("colorSelect");

  // 화면 진입 시 주소창 조건에 맞게 인풋창 및 필터 값들 세밀하게 복원
  if(document.querySelector("#keywordInput")) document.querySelector("#keywordInput").value = currentParams.get("keyword") || "";
  if(document.querySelector("#authorInput")) document.querySelector("#authorInput").value = currentParams.get("author") || "";
  if(document.querySelector("#statusSelect")) document.querySelector("#statusSelect").value = currentParams.get("status") || "";
  if(document.querySelector("#startDateInput")) document.querySelector("#startDateInput").value = currentParams.get("startDate") || "";
  if(document.querySelector("#endDateInput")) document.querySelector("#endDateInput").value = currentParams.get("endDate") || "";
  if(document.querySelector("#sortSelect")) document.querySelector("#sortSelect").value = currentParams.get("sort") || "latest";

  // 주소창 색상 선택되어 있었다면 강제 동기화
  if(colorSelect) colorSelect.value = currentParams.get("colorSelect") || "";

  // 주소창에 기존 대분류가 선택되어 있었다면 셀렉트 박스 강제 동기화
  const urlMainCat = currentParams.get("category") || "";
  if (mainSelect) mainSelect.value = urlMainCat;

  // 2. [작성 사양 100% 매칭] 한 오차도 없이 일치시킨 대분류/소분류 정규화 데이터 맵
  const subCategoryMap = JSON.parse('{' +
    '"가방":["여성용가방","남성용가방","기타가방"],' +
    '"귀금속":["반지","목걸이","귀걸이","시계","기타"],' +
    '"도서":["학습서적","소설","컴퓨터서적","만화책","기타서적"],' +
    '"의류":["여성의류","남성의류","아기의류","모자","신발","기타의류"],' +
    '"자동차":["자동차열쇠","네비게이션","자동차번호판","임시번호판","기타용품"],' +
    '"핸드폰":["삼성휴대폰","LG휴대폰","아이폰","기타휴대폰","기타통신기기"],' +
    '"전자기기":["태블릿","스마트워치","무선이어폰","카메라","기타용품"],' +
    '"지갑":["여성용 지갑","남성용 지갑","기타 지갑"],' +
    '"카드":["신용(체크)카드","일반카드","교통카드","기타카드"]' +
  '}');

  // 3. [소분류 목록 생성 함수] 대분류 변경 시 소분류 option을 실시간 드로잉하는 장치
  function updateSubCategoryOptions(mainValue, currentSubValue) {
    if (!subSelect) return;
    subSelect.innerHTML = '<option value="">소분류 선택</option>';
    
    if (mainValue && subCategoryMap[mainValue]) {
      subCategoryMap[mainValue].forEach(function(sub) {
        const opt = document.createElement("option");
        opt.value = sub;
        opt.innerText = sub;
        if (sub === currentSubValue) {
          opt.selected = true;
        }
        subSelect.appendChild(opt);
      });
    }
  }

  // 4. 대분류 상자 실시간 변경(change) 감지 리스너 연결
  if (mainSelect) {
    mainSelect.addEventListener("change", function() {
      updateSubCategoryOptions(this.value, "");
    });
  }

  // 5. [최초 로딩 스위치] 새로고침 직후 기존 소분류 데이터 리스트 미리 채워두기
  const urlSubCat = currentParams.get("subCategory") || "";
  if (urlMainCat) {
    updateSubCategoryOptions(urlMainCat, urlSubCat);
  }

  // 6. [교정] 6대 복합 필터 값을 엮어서 새로고침 전송하는 통합 주소 조립기 함수
  async function loadBoardList(targetPage=1) {
    const params = new URLSearchParams();
    const mainCat = mainSelect ? mainSelect.value : "";
    const subCat = subSelect ? subSelect.value : "";
    const color = colorSelect ? colorSelect.value : ""; 
    const keyword = document.getElementById("keywordInput") ? document.getElementById("keywordInput").value.trim() : "";
    const author = document.getElementById("authorInput") ? document.getElementById("authorInput").value.trim() : "";
    const status = document.getElementById("statusSelect") ? document.getElementById("statusSelect").value : "";
    const startDate = document.getElementById("startDateInput") ? document.getElementById("startDateInput").value : "";
    const endDate = document.getElementById("endDateInput") ? document.getElementById("endDateInput").value : "";

    // 유효성 방어선 검증 바인딩 (빈 선택값이거나 '선택' 단어가 포함되면 params 적재 제외)
    if (mainCat && mainCat !== "" && !mainCat.includes("선택")) params.set("category", mainCat);
    if (subCat && subCat !== "" && !subCat.includes("선택")) params.set("subCategory", subCat);
    if (color && color !== "" && !color.includes("선택")) params.set("colorSelect", color);
    if (keyword && keyword !== "") params.set("keyword", keyword);
    if (author && author !== "") params.set("author", author);
    if (status && status !== "" && !status.includes("전체")) params.set("status", status);
    if (startDate && startDate !== "") params.set("startDate", startDate);
    if (endDate && endDate !== "") params.set("endDate", endDate);
    
    // 정렬 엘리먼트 값 수집 추가
    const sortEl = document.querySelector("#sortSelect");
    if (sortEl) params.set("sort", sortEl.value);

    // 검색 시 언제나 무조건 1페이지부터 목록 리스트가 개설되도록 처리
    params.set("page", "1");

    window.location.href = window.location.pathname + "?" + params.toString();
  }

  // 7. [초기화 실행] 모든 입력 필드를 비우고 파라미터가 없는 순정 첫 페이지 주소로 점프
  function resetAdvancedSearchForm() {
    window.location.href = window.location.pathname;
  }

  // 8. 최종 물리적 엘리먼트 이벤트 리스너 결합 마감
  if (document.getElementById("searchSubmitBtn")) {
    document.getElementById("searchSubmitBtn").addEventListener("click", loadBoardList);
  }
  if (document.getElementById("resetBtn")) {
    document.getElementById("resetBtn").addEventListener("click", resetAdvancedSearchForm);
  }
  if (document.querySelector("#sortSelect")) {
    document.querySelector("#sortSelect").addEventListener("change", loadBoardList);
  }
/*]]>*/
</script>


</body>
</html>
