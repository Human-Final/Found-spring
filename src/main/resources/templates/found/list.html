<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>습득 게시판</title>

  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/board/list.css}">
</head>

<body>

<div th:replace="layout/header :: headerFragment"></div>

<main class="board-page">

  <section class="board-hero found">
    <div>
      <h2>습득 게시판</h2>
      <p>습득한 물건을 등록하고 주인을 찾아주세요</p>
    </div>

    <a th:href="@{/api/write}" class="write-btn">글쓰기</a>
  </section>

  <section class="filter-box">
    <div class="board-search">
      <span>⌕</span>
      <input type="text" id="keywordInput" placeholder="게시글 검색...">
    </div>

    <div class="filter-row">
      <div class="filter-section">
        <span class="filter-label">카테고리</span>

        <div id="categoryFilter" class="chip-group">
          <button type="button" class="chip active" data-category="">전체</button>
          <button type="button" class="chip" data-category="가방">가방</button>
          <button type="button" class="chip" data-category="귀금속">귀금속</button>
          <button type="button" class="chip" data-category="도서">도서</button>
          <button type="button" class="chip" data-category="의류">의류</button>
          <button type="button" class="chip" data-category="자동차">자동차</button>
          <button type="button" class="chip" data-category="전자기기">전자기기</button>
          <button type="button" class="chip" data-category="지갑">지갑</button>
          <button type="button" class="chip" data-category="카드">카드</button>
          <button type="button" class="chip" data-category="기타">기타</button>
        </div>
      </div>
      <div class="filter-section status-section">
        <span class="filter-label">상태</span>

        <div id="statusFilter" class="chip-group">
          <button type="button" class="chip active" data-status="">전체</button>
          <button type="button" class="chip" data-status="진행중">진행중</button>
          <button type="button" class="chip" data-status="완료">완료</button>
        </div>
      </div>
    </div>
  </section>
  
  <div class="count-sort">
    <p th:text="|총 ${paging.totalCount}건|" class="total-count">총 2건</p>    
    <select class="sort-select" id="sortSelect">
      <option value="latest">최신순</option>
      <option value="oldest">오래된순</option>
    </select>
  </div>

  <section class="post-grid">
    <a 
      th:each="foundVO : ${getList}"
      th:href="@{/api/found/detail/{atcId}(atcId=${foundVO.atcId})}"
      class="post-card">

      <div class="post-top">
        <div class="tag-group">
          <span class="type-tag found">습득</span>
          <span th:text="${foundVO.prdtClNm}" class="category-tag">카테고리</span>
        </div>
        <span class="status-tag"
          th:classappend="${foundVO.done==1 ? 'status-tag-done' : 'status-tag-progress'}"
          th:text="${foundVO.done == 1 ? '✓ 완료' : '○ 진행중'}">
          상태
        </span>
      </div>

      <h4 th:text="${foundVO.fdPrdtNm}" class="post-title">제목</h4>
      <p th:text="${foundVO.fdSbjt}" 
         th:title="${foundVO.fdSbjt}"
         class="post-desc">글 내용</p>

      <div class="post-divider"></div>

      <div class="post-info">
        <div class="info-item">
          <strong>물품명</strong>
          <p th:text="${foundVO.fdPrdtNm}">물품명</p>
        </div>
        <div class="info-item">
          <strong>색상명</strong>
          <p th:text="${foundVO.clrNm}">색상명</p>
        </div>
        <div class="info-item">
          <strong>습득지역</strong>
          <p th:text="${foundVO.depPlace}">습득지역</p>
        </div>
        <div class="info-item">
          <strong>습득일자</strong>
          <p th:text="${foundVO.fdYmd}">습득일자</p>
        </div>
        <div class="info-item">
          <strong>물품분류</strong>
          <p th:text="${foundVO.prdtClNm}">물품분류</p>
        </div>
        <div class="info-item">
          <strong>작성자</strong>
          <p th:text="${foundVO.id !=null ? foundVO.id : foundVO.depPlace}">작성자</p>
        </div>                
      </div>
      <div class="post-bottom">
        <span>작성날짜(몇일 전 로직으로 구현)</span>
        <div class="post-counts">
          <span>조회 수</span>
          <span>댓글 수</span>
        </div>
      </div>
    </a>
  </section>
  
  <div class="pagination" th:if="${paging.totalCount > 0}">
    <a 
      th:if="${paging.prev}"
      th:href="@{/api/found(page=${paging.startPage -1})}"
      class="page-btn">
      이전
    </a>

    <a
      th:each="pageNum : ${#numbers.sequence(paging.startPage, paging.endPage)}"
      th:href="@{/api/found(page=${pageNum})}"
      th:text="${pageNum}"
      th:classappend="${pageNum==paging.page} ? 'active' : ''"
      class="page-btn">
      1
    </a>

    <a th:if="${paging.next}"
      th:href="@{/api/found(page=${paging.endPage + 1})}"
      class="page-btn">
      다음
    </a>

  </div>

</main>

<div th:replace="layout/footer :: footerFragment"></div>

<script>
  const currentParams = new URLSearchParams(window.location.search);
  let selectedCategory = currentParams.get("category") || "";
  let selectedStatus = currentParams.get("status") || "";

  document.querySelector("#keywordInput").value = currentParams.get("keyword") || "";
  document.querySelector("#sortSelect").value = currentParams.get("sort") || "latest";

  // 카테고리 선택 조회 기능
  function bindCategoryFilter() {
    const buttons = document.querySelectorAll("#categoryFilter .chip");

    buttons.forEach(button => {
      button.classList.toggle("active",
        button.dataset.category === selectedCategory
      );
        
      button.addEventListener("click", function(){
        selectedCategory = this.dataset.category;
        loadBoardList();
      });
    });
  }

  // 상태 선택 조회 기능
  function bindStatusFilter() {
    const buttons = document.querySelectorAll("#statusFilter .chip");

    buttons.forEach(button => {
      button.classList.toggle("active",
        button.dataset.status === selectedStatus
      );
        
      button.addEventListener("click", function(){
        selectedStatus = this.dataset.status;
        loadBoardList();
      });
    });
  }

  function getCategoryLabel(prdtClNm) {
    if (!prdtClNm) return "기타";

    if (["가방", "백"].some(word => prdtClNm.includes(word))) return "가방";
    if (["귀금속", "반지", "목걸이", "귀걸이", "시계"].some(word => prdtClNm.includes(word))) return "귀금속";
    if (["도서", "책", "서적", "소설"].some(word => prdtClNm.includes(word))) return "도서";
    if (["의류", "모자", "신발"].some(word => prdtClNm.includes(word))) return "의류";
    if (["자동차", "네비", "번호판"].some(word => prdtClNm.includes(word))) return "자동차";
    if (["전자", "핸드폰", "휴대폰", "아이폰", "노트북", "컴퓨터"].some(word => prdtClNm.includes(word))) return "전자기기";
    if (prdtClNm.includes("지갑")) return "지갑";
    if (prdtClNm.includes("카드")) return "카드";

    return "기타";
  }

  async function loadBoardList() {
    const params = new URLSearchParams();
    const keyword = document.querySelector("#keywordInput").value.trim();

    if (keyword) {
      params.set("keyword", keyword);
    }

    if (selectedCategory) {
      params.set("category", selectedCategory);
    }

    if (selectedStatus) {
      params.set("status", selectedStatus);
    }

    params.set("sort", document.querySelector("#sortSelect").value);

    window.location.href = window.location.pathname + "?" + params.toString();
  }

  document.querySelector("#sortSelect").addEventListener("change", loadBoardList);

  bindCategoryFilter();
  bindStatusFilter();
</script>

</body>
</html>
