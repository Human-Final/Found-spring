<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>

  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/user/login.css}">
</head>

<body>

<div th:replace="layout/header :: headerFragment"></div>

<main class="auth-page">

  <div class="login-modal">
    <div class="login-header">
      <h2>로그인</h2>
      <a href="/" class="close-btn">×</a>
    </div>

    <div class="tab-menu">
      <a href="/login" class="active">로그인</a>
      <a href="/join">회원가입</a>
    </div>

    <div class="login-content">
      <!-- 회원탈퇴 완료 메시지 -->
      <div th:if="${message}" class="alert-message">
        <span th:text="${message}"></span>
      </div>
      <form action="/login" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">
          <label for="id">아이디</label>
          <div class="input-wrap">
            <input type="text" id="id" name="id" placeholder="아이디 입력">
          </div>
        </div>

        <div class="form-group">
          <label for="pw">비밀번호</label>
          <div class="input-wrap">
            <input type="password" id="pw" name="pw" placeholder="비밀번호 입력">
            <span class="eye-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <button type="submit" class="login-submit">로그인</button>
      </form>
    </div>
  </div>

</main>

<div th:replace="layout/footer :: footerFragment"></div>

</body>
</html>
