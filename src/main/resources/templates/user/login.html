<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #eef3f9;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-modal {
      width: 420px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
      overflow: hidden;
    }

    .login-header {
      height: 62px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }

    .login-header h2 {
      font-size: 17px;
      font-weight: 800;
    }

    .close-btn {
      color: #64748b;
      font-size: 24px;
      line-height: 1;
      text-decoration: none;
    }

    .tab-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 48px;
      border-bottom: 1px solid #e2e8f0;
    }

    .tab-menu a {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      border-bottom: 2px solid transparent;
    }

    .tab-menu a.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    .login-content {
      padding: 22px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #475569;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 44px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 14px;
      outline: none;
      font-size: 14px;
      color: #0f172a;
      background: #f8fafc;
    }

    .input-wrap input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .input-wrap input::placeholder {
      color: #94a3b8;
    }

    .eye-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      display: flex;
      align-items: center;
    }

    .login-submit {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .login-submit:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <div class="login-modal">
    <div class="login-header">
      <h2>로그인</h2>
      <a href="/" class="close-btn">×</a>
    </div>

    <div class="tab-menu">
      <a href="/login" class="active">로그인</a>
      <a href="/join">회원가입</a>
    </div>

    <div class="login-content">
      <form action="/login" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="form-group">
          <label for="id">아이디</label>
          <div class="input-wrap">
            <input type="text" id="id" name="id" placeholder="아이디 입력">
          </div>
        </div>

        <div class="form-group">
          <label for="pw">비밀번호</label>
          <div class="input-wrap">
            <input type="password" id="pw" name="pw" placeholder="비밀번호 입력">
            <span class="eye-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </span>
          </div>
        </div>

        <button type="submit" class="login-submit">로그인</button>
      </form>
    </div>
  </div>
</body>
</html>
