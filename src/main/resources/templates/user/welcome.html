<!DOCTYPE html>
<html lang="ko" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입 완료</title>

  <!-- 공통 및 회원용 CSS 적용 -->
  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/user/login.css}">
</head>

<body>

<div th:replace="layout/header :: headerFragment"></div>

<main class="auth-page">

  <!-- 가입 완료를 알리는 모달창 -->
  <div class="login-modal" style="text-align: center; padding: 40px 30px;">
    
    <!-- 화사한 환영 그래픽/아이콘 영역 -->
    <div class="welcome-icon" style="font-size: 50px; margin-bottom: 20px; animation: bounce 1s infinite alternate;">
      🎉
    </div>

    <div class="login-header" style="border-bottom: none; margin-bottom: 0; padding-bottom: 0; width: 100%; text-align: center;">
      <h2 style="font-size: 26px; color: #333; font-weight: 700; letter-spacing: -0.5px; display: inline-block; width: 100%; text-align: center;">
        회원가입 완료!
      </h2>
    </div>

    <div class="login-content">
      
      <!-- 컨트롤러에서 넘겨받은 userId를 활용한 환영 멘트 -->
      <div class="welcome-message" style="margin: 25px 0; line-height: 1.6; color: #555; font-size: 16px;">
        안녕하세요, <strong th:text="${userId}" style="color: #4a90e2; font-size: 18px;">사용자</strong>님! 🥰<br>
        회원가입이 완료되셨습니다.<br>
        이용 전 공지사항을 참고해주시기 바랍니다.
      </div>

      <!-- 구분선 역할 -->
      <hr style="border: 0; height: 1px; background: #eee; margin: 30px 0;">

      <!-- 바로 로그인할 수 있는 이동 버튼 -->
      <div class="form-group">
        <a href="/login" class="login-submit" style="display: block; text-decoration: none; line-height: 45px; background: linear-gradient(135px, #6a11cb 0%, #2575fc 100%); color: #fff; font-weight: bold; border-radius: 6px; box-shadow: 0 4px 15px rgba(37, 117, 252, 0.2);">
          로그인하러 가기
        </a>
      </div>

      <!-- 메인 화면 이동용 보조 링크 -->
      <div class="login-helper" style="margin-top: 20px; font-size: 14px;">
        <a href="/" style="color: #999; text-decoration: none; hover: color #666;">홈으로 돌아가기</a>
      </div>

    </div>
  </div>

</main>

<div th:replace="layout/footer :: footerFragment"></div>

<!-- 간단한 아이콘 바운스 애니메이션 효과 효과 추가 -->
<style>
  @keyframes bounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-10px); }
  }
</style>

</body>
</html>
