<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>아이디 찾기</title>
  
  <!-- 기존 로그인 페이지에서 사용하는 CSS 파일 경로를 넣어주세요 -->
  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/user/login.css}">
  
  <style>
    /* 아이디 찾기 페이지 전용 추가 스타일 */
    .result-box {
      display: none;
      background-color: #f4f6f9;
      border: 1px solid #e1e4e6;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .result-box.active {
      display: block;
    }
    .found-id {
      display: block;
      font-size: 18px;
      font-weight: bold;
      color: #1a73e8;
      margin-top: 8px;
    }
    .error-message {
      color: #dc3545;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
    .action-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 15px;
      font-size: 14px;
    }
    .action-links a {
      color: #666;
      text-decoration: none;
    }
    .action-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div th:replace="layout/header :: headerFragment"></div>

<main class="auth-page">
  <div class="login-modal">
    <div class="login-header">
      <h2>아이디 찾기</h2>
      <a href="/login" class="close-btn">×</a>
    </div>

    <div class="login-content">
      <!-- 1. 결과를 보여주는 박스 (처음엔 숨김) -->
      <div id="resultBox" class="result-box">
        <p>검색 결과</p>
        <span id="userIdDisplay" class="found-id"></span>
      </div>

      <!-- 에러 메시지 출력 영역 -->
      <div id="errorMessage" class="error-message"></div>

      <!-- 2. 정보 입력 폼 -->
      <form id="findIdForm" onsubmit="submitFindId(event)">
        <!-- CSRF 토큰 안전 장치 (Spring Security 사용 시 필수) -->
        <input type="hidden" id="csrfToken" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
          <label for="name">이름</label>
          <div class="input-wrap">
            <input type="text" id="name" placeholder="이름 입력" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">이메일</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="이메일 입력" required>
          </div>
        </div>

        <button type="submit" class="login-submit">아이디 찾기</button>
      </form>

      <!-- 하단 링크 이동 매뉴 -->
      <div class="action-links">
        <a href="/login">로그인하러 가기</a>
        <span style="color: #ccc;">|</span>
        <a href="/find-pw">비밀번호 찾기</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="layout/footer :: footerFragment"></div>

<script>
  function submitFindId(event) {
    event.preventDefault(); // 폼 제출 시 페이지 새로고침 방지

    // 입력값 가져오기
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    
    // HTML에 박혀있는 CSRF 토큰 값 읽기
    const csrfToken = document.getElementById('csrfToken').value;

    const resultBox = document.getElementById('resultBox');
    const userIdDisplay = document.getElementById('userIdDisplay');
    const errorMessage = document.getElementById('errorMessage');
    const findIdForm = document.getElementById('findIdForm');

    // 메시지 초기화
    errorMessage.style.display = 'none';
    errorMessage.innerText = '';

    // 백엔드 컨트롤러에 비동기 데이터 요청 (url 주소는 백엔드 설계에 맞게 수정 가능)
    fetch('/find-id', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-TOKEN': csrfToken // 스프링 시큐리티 차단 방지
      },
      body: JSON.stringify({
        name: name,
        email: email
      })
    })
    .then(response => {
      if (!response.ok) {
        throw new Error('일치하는 회원 정보가 없습니다.');
      }
      // 1. 기존의 response.json() 대신 response.text()로 변경하여 글자 그대로 읽습니다!
      return response.text(); 
    })
    .then(data => {
      // 2. 데이터가 존재하고, 컨트롤러가 보낸 실패 신호("FAIL")가 아니라면 성공 처리합니다.
      if (data && data !== "FAIL") {
        userIdDisplay.innerText = data; // 가져온 아이디 글자("tyk517")를 그대로 화면에 꽂아줍니다.
        resultBox.classList.add('active'); // 결과창 노출
        findIdForm.style.display = 'none'; // 입력창 숨김
      } else {
        throw new Error('일치하는 회원 정보가 없습니다.');
      }
    })
    .catch(error => {
      // 만약 JSON 파싱 에러나 실패가 나면 이곳으로 들어옵니다.
      if(error.message.includes("valid JSON") || error.message.includes("Unexpected token")) {
          errorMessage.innerText = "서버 응답 형식이 올바르지 않습니다.";
      } else {
          errorMessage.innerText = error.message;
      }
      errorMessage.style.display = 'block';
    });
  }
</script>

</body>
</html>
