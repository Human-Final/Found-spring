<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>

<h2>회원가입</h2>

<p th:if="${error}"
   th:text="${error}"
   style="color:red; font-weight:bold;">
</p>

<form action="/join" method="post" onsubmit="return validateJoinForm()">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">

    <div>
        <label>아이디</label>
        <input type="text" id="id" name="id" required oninput="resetIdCheck()">
        <button type="button" onclick="checkId()">중복확인</button>
        <p id="idCheckResult"></p>
    </div>

    <div>
        <label>비밀번호</label>
        <input type="password" id="pw" name="pw" required onkeyup="validatePassword(); checkPasswordMatch();">
        <p id="pwRuleResult"></p>
    </div>

    <div>
        <label>비밀번호 확인</label>
        <input type="password" id="pwCheck" name="pwCheck" required onkeyup="checkPasswordMatch()">
        <p id="pwMatchResult"></p>
    </div>

    <div>
        <label>이메일</label>
        <input type="email" name="email" required>
    </div>

    <div>
        <label>전화번호</label>
        <input type="text" name="tel" required>
    </div>

    <button type="submit">회원가입</button>

</form>

<hr>

<a href="/login">
    <button type="button">로그인으로 이동</button>
</a>

<script>
    let isIdChecked = false;
    let isIdAvailable = false;

    function checkId() {
        const id = document.getElementById("id").value;
        const result = document.getElementById("idCheckResult");

        if (id.trim() === "") {
            alert("아이디를 입력하세요.");
            isIdChecked = false;
            isIdAvailable = false;
            result.innerText = "아이디를 입력하세요.";
            result.style.color = "red";
            return;
        }

        fetch("/check-id?id=" + encodeURIComponent(id))
            .then(response => response.text())
            .then(data => {
                isIdChecked = true;

                if (data === "duplicated") {
                    isIdAvailable = false;
                    result.innerText = "이미 사용 중인 아이디입니다.";
                    result.style.color = "red";
                } else {
                    isIdAvailable = true;
                    result.innerText = "사용 가능한 아이디입니다.";
                    result.style.color = "green";
                }
            });
    }

    function resetIdCheck() {
        isIdChecked = false;
        isIdAvailable = false;

        const result = document.getElementById("idCheckResult");
        result.innerText = "아이디 중복확인을 해주세요.";
        result.style.color = "gray";
    }

    function validatePassword() {
        const pw = document.getElementById("pw").value;
        const result = document.getElementById("pwRuleResult");

        let count = 0;

        if (/[A-Z]/.test(pw)) count++;
        if (/[a-z]/.test(pw)) count++;
        if (/[0-9]/.test(pw)) count++;
        if (/[^A-Za-z0-9]/.test(pw)) count++;

        if (pw.length < 8) {
            result.innerText = "비밀번호는 8자 이상이어야 합니다.";
            result.style.color = "red";
            return false;
        }

        if (count < 3) {
            result.innerText = "대문자, 소문자, 숫자, 특수문자 중 3가지 이상 포함해야 합니다.";
            result.style.color = "red";
            return false;
        }

        result.innerText = "사용 가능한 비밀번호입니다.";
        result.style.color = "green";
        return true;
    }

    function checkPasswordMatch() {
        const pw = document.getElementById("pw").value;
        const pwCheck = document.getElementById("pwCheck").value;
        const result = document.getElementById("pwMatchResult");

        if (pwCheck === "") {
            result.innerText = "";
            return false;
        }

        if (pw === pwCheck) {
            result.innerText = "비밀번호가 일치합니다.";
            result.style.color = "green";
            return true;
        }

        result.innerText = "비밀번호가 일치하지 않습니다.";
        result.style.color = "red";
        return false;
    }

    function validateJoinForm() {
        if (!isIdChecked) {
            alert("아이디 중복확인을 해주세요.");
            return false;
        }

        if (!isIdAvailable) {
            alert("이미 사용 중인 아이디입니다.");
            return false;
        }

        if (!validatePassword()) {
            alert("비밀번호 규칙을 확인해주세요.");
            return false;
        }

        if (!checkPasswordMatch()) {
            alert("비밀번호가 일치하지 않습니다.");
            return false;
        }

        return true;
    }
</script>

</body>
</html>
