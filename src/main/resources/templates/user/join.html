<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/user/join.css}">
</head>

<body>

<div th:replace="layout/header :: headerFragment"></div>

<main class="join-page">

    <section class="join-modal">

        <div class="join-header">
            <h2>회원가입</h2>
            <a href="/" class="close-btn">×</a>
        </div>

        <div class="join-tab-menu">
            <a href="/login">로그인</a>
            <a href="/join" class="active">회원가입</a>
        </div>

        <div class="join-content">

            <p th:if="${error}"
               th:text="${error}"
               class="error-message">
            </p>

            <form action="/join" method="post" onsubmit="return validateJoinForm()">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="id">아이디</label>
                    <div class="id-row">
                        <input type="text"
                            id="id"
                            name="id"
                            required
                            maxlength="20"
                            minlength="4"
                            pattern="^[a-zA-Z0-9_]{4,20}$"
                            title="아이디는 영문과 숫자, _(언더바)만 사용 가능하며 4~20자로 입력해주세요."
                            placeholder="영문, 숫자 4~20자"
                            oninput="resetIdCheck(); validateIdFormat();">

                        <button type="button"
                                class="id-check-btn"
                                onclick="checkId()">
                            중복확인
                        </button>
                    </div>

                    <p id="idCheckResult" class="check-text"></p>
                </div>

                <div class="form-group">
                    <label>비밀번호</label>

                    <input type="password"
                           id="pw"
                           name="pw"
                           required
                           placeholder="8자 이상"
                           onkeyup="validatePassword(); checkPasswordMatch();">

                    <p id="pwRuleResult" class="check-text"></p>
                </div>

                <div class="form-group">
                    <label>비밀번호 확인</label>

                    <input type="password"
                           id="pwCheck"
                           name="pwCheck"
                           required
                           placeholder="비밀번호 재입력"
                           onkeyup="checkPasswordMatch()">

                    <p id="pwMatchResult" class="check-text"></p>
                </div>

                <div class="form-group">
                    <label>이름</label>
                    <input type="text"
                           name="name"
                           required
                           placeholder="이름 입력">
                </div>

                <div class="form-group">
                    <label>이메일</label>

                    <div class="id-row">
                        <input type="email"
                               id="email"
                               name="email"
                               required
                               placeholder="example@email.com"
                               oninput="resetEmailCheck()">

                        <button type="button"
                                class="id-check-btn"
                                onclick="checkEmail()">중복확인</button>
                    </div>

                    <p id="emailCheckResult" class="check-text"></p>
                    
                    <div id="emailSendBtnGroup" style="display: none; margin-top: 10px; width: 100%;">
                        <button type="button" id="btnSendEmail" onclick="sendEmailAuth()" class="id-check-btn" style="width: 100%; height: 38px; background-color: #4dabf7; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                            인증번호 전송하기
                        </button>
                    </div>

                    <div id="emailAuthGroup" style="display: none; margin-top: 10px; width: 100%;">
                        <label style="font-size: 12px; color: #fa5252; font-weight: bold; margin-bottom: 4px; display: block;">
                            이메일 인증번호 제한시간 <span id="emailTimer">03:00</span>
                        </label>
                        <div class="id-row" style="display: flex; gap: 10px;">
                            <input type="text" id="emailAuthCode" maxlength="6" placeholder="숫자 6자리 입력" style="flex: 1; text-align: center; font-weight: bold; letter-spacing: 4px; height: 38px; border: 1px solid #ced4da; border-radius: 4px;">
                            <button type="button" id="btnVerifyCode" onclick="submitEmailVerification()" class="id-check-btn" style="white-space: nowrap; background-color: #2b8a3e; color: white; border: none; border-radius: 4px; padding: 0 15px; cursor: pointer; font-weight: bold;">인증확인</button>
                        </div>
                        <p id="emailAuthMessage" style="display: none; margin-top: 4px; font-size: 12px;"></p>
                    </div>

                </div>

                <div class="form-group">
                    <label style="font-weight: 600; display: block; margin-bottom: 8px; color: #444; font-size: 14px;">전화번호</label>
                    
                    <!-- flex 레이아웃을 활용해 입력창들과 버튼을 한 줄로 나란히 배치 -->
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;">
                        
                        <!-- 입력창 박스 그룹 (하이픈 포함 가로 배치) -->
                        <div style="display: flex; align-items: center; gap: 6px; flex-grow: 1;">
                            <!-- 010 기본 세팅 및 수정 불가 -->
                            <input type="text" id="phone1" value="010" readonly 
                                style="width: 25%; min-width: 50px; text-align: center; padding: 12px; border: 1px solid #dcdfe6; border-radius: 6px; background-color: #f5f7fa; color: #606266; font-size: 14px; box-sizing: border-box;" />
                            <span style="color: #dcdfe6;">-</span>
                            
                            <input type="text" id="phone2" maxlength="4" placeholder="0000" oninput="commonPhoneHandler(this, 'phone3')" required
                                style="width: 36%; height: 46px; text-align: center; border: 1px solid #dcdfe6; border-radius: 8px; outline: none; font-size: 14px; color: #333; box-sizing: border-box; transition: border-color 0.2s;" 
                                onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#dcdfe6'" />
                            <span style="color: #dcdfe6; font-size: 14px;">-</span>
                            
                            <!-- 마지막 4자리 입력창 -->
                            <input type="text" id="phone3" maxlength="4" placeholder="0000" oninput="commonPhoneHandler(this, null)" required
                                style="width: 36%; height: 46px; text-align: center; border: 1px solid #dcdfe6; border-radius: 8px; outline: none; font-size: 14px; color: #333; box-sizing: border-box; transition: border-color 0.2s;" 
                                onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#dcdfe6'" />
                        </div>
                    </div>
                    <span id="telResult" style="font-size: 13px; display: block; margin-top: 6px;"></span>
                    
                    <!-- 실제 서버 전송 및 스크립트 결합용 히든 파라미터 -->
                    <input type="hidden" id="tel" name="tel" />
                </div>


                <button type="submit" class="join-submit">회원가입</button>

            </form>

        </div>

    </section>

</main>

<div th:replace="layout/footer :: footerFragment"></div>

<script>
    let isIdChecked = false;
    let isIdAvailable = false;

    let isEmailChecked = false;
    let isEmailAvailable = false;

    let emailTimerInterval = null;
    let isEmailAuthVerified = false;

    function validateIdFormat() {
        const id = document.getElementById("id").value;
        const result = document.getElementById("idCheckResult");
        const idRegex = /^[a-zA-Z0-9_]{4,20}$/;

        if (id === "") {
            result.innerText = "";
            return false;
        }

        if (!idRegex.test(id)) {
            result.innerText = "아이디는 영문, 숫자, _(언더바)만 사용할 수 있습니다.";
            result.style.color = "red";
            return false;
        }

        result.innerText = "아이디 중복확인을 해주세요.";
        result.style.color = "gray";
        return true;
    }

    function checkId() {
        const id = document.getElementById("id").value;
        const result = document.getElementById("idCheckResult");
        const idRegex = /^[a-zA-Z0-9_]+$/;

        if (id.trim() === "") {
            alert("아이디를 입력하세요.");
            isIdChecked = false;
            isIdAvailable = false;
            result.innerText = "아이디를 입력하세요.";
            result.style.color = "red";
            return;
        }

        if (!idRegex.test(id)) {
            alert("아이디는 영문, 숫자, _(언더바)만 사용할 수 있습니다.");
            isIdChecked = false;
            isIdAvailable = false;
            result.innerText = "아이디는 영문, 숫자, _(언더바)만 사용할 수 있습니다.";
            result.style.color = "red";
            return;
        }

        fetch("/check-id?id=" + encodeURIComponent(id))
            .then(response => response.text())
            .then(data => {
                isIdChecked = true;

                if (data === "duplicated") {
                    isIdAvailable = false;
                    result.innerText = "이미 사용 중인 아이디입니다.";
                    result.style.color = "red";
                } else {
                    isIdAvailable = true;
                    result.innerText = "사용 가능한 아이디입니다.";
                    result.style.color = "green";
                }
            });
    }

    function resetIdCheck() {
        isIdChecked = false;
        isIdAvailable = false;
    }

    function validateTel() {
        const tel = document.getElementById("tel").value;
        const result = document.getElementById("telResult");

        // HTML에 메시지를 찍어줄 엘리먼트(#telResult)가 없다면 함수 실행 방지
        if (!result) return false;

        // 1. 빈 값 방어선 검사
        if (tel === "" || tel.length <= 3) {
            result.innerText = "전화번호를 입력해 주세요.";
            result.style.color = "#dc3545"; // 경고 빨간색
            return false;
        }

        // 2. 🎯 하이픈 없이 010으로 시작하는 순수 숫자 11자리 검증 정규식 (010 + 숫자 8자리)
        const telRegex = /^010\d{8}$/;

        if (!telRegex.test(tel)) {
            // 정규식을 통과하지 못한 경우 (숫자가 모자라거나 포맷이 틀린 경우)
            result.innerText = "올바른 전화번호 형식(11자리 숫자)이 아닙니다.";
            result.style.color = "#dc3545";
            return false;
        } else {
            // 3. 모든 검증을 완벽하게 통과한 경우
            result.innerText = "올바른 전화번호 형식입니다.";
            result.style.color = "#2ecc71"; // 통과 초록색
            return true;
        }
    }

    function commonPhoneHandler(currentInput, nextInputId) {
        currentInput.value = currentInput.value.replace(/[^0-9]/g, '');

        if (currentInput.value.length >= 4 && nextInputId) {
            const nextEl = document.getElementById(nextInputId);
            if (nextEl) nextEl.focus();
        }

        const p1 = document.getElementById("phone1").value;
        const p2 = document.getElementById("phone2").value;
        const p3 = document.getElementById("phone3").value;

        document.getElementById("tel").value = p1 + p2 + p3;

        validateTel();
    }

    function validatePassword() {
        const pw = document.getElementById("pw").value;
        const result = document.getElementById("pwRuleResult");

        let count = 0;

        if (/[A-Z]/.test(pw)) count++;
        if (/[a-z]/.test(pw)) count++;
        if (/[0-9]/.test(pw)) count++;
        if (/[^A-Za-z0-9]/.test(pw)) count++;

        if (pw.length < 8) {
            result.innerText = "비밀번호는 8자 이상이어야 합니다.";
            result.style.color = "red";
            return false;
        }

        if (count < 3) {
            result.innerText = "대문자, 소문자, 숫자, 특수문자 중 3가지 이상 포함해야 합니다.";
            result.style.color = "red";
            return false;
        }

        result.innerText = "사용 가능한 비밀번호입니다.";
        result.style.color = "green";
        return true;
    }

    function checkPasswordMatch() {
        const pw = document.getElementById("pw").value;
        const pwCheck = document.getElementById("pwCheck").value;
        const result = document.getElementById("pwMatchResult");

        if (pwCheck === "") {
            result.innerText = "";
            return false;
        }

        if (pw === pwCheck) {
            result.innerText = "비밀번호가 일치합니다.";
            result.style.color = "green";
            return true;
        }

        result.innerText = "비밀번호가 일치하지 않습니다.";
        result.style.color = "red";
        return false;
    }

    function validateJoinForm() {
        const id = document.getElementById("id").value;
        const idRegex = /^[a-zA-Z0-9]+$/;

        if (!idRegex.test(id)) {
            alert("아이디는 영문, 숫자, _(언더바)만 사용할 수 있습니다.");
            return false;
        }

        if (!isIdChecked) {
            alert("아이디 중복확인을 해주세요.");
            return false;
        }

        if (!isIdAvailable) {
            alert("이미 사용 중인 아이디입니다.");
            return false;
        }

        if (!validatePassword()) {
            alert("비밀번호 규칙을 확인해주세요.");
            return false;
        }

        if (!checkPasswordMatch()) {
            alert("비밀번호가 일치하지 않습니다.");
            return false;
        }

        if (!isEmailChecked) {
            alert("이메일 중복확인을 해주세요.");
            return false;
        }

        if (!isEmailAvailable) {
            alert("이미 사용 중인 이메일입니다.");
            return false;
        }

        if (!isEmailAuthVerified) {
            alert("이메일로 발송된 6자리 인증번호가 확인되지 않았습니다");
            document.getElementById("emailAuthCode").focus();
            return false;
        }

        if (!validateTel()) {
            alert("전화번호 형식이 올바르지 않습니다")
            return false;
        }
        
        return true;
    }

    function checkEmail() {
        const email = document.getElementById("email").value;
        const result = document.getElementById("emailCheckResult");

        if (email.trim() === "") {
            alert("이메일을 입력하세요.");
            isEmailChecked = false;
            isEmailAvailable = false;
            result.innerText = "이메일을 입력하세요.";
            result.style.color = "red";
            return;
        }

        fetch("/check-email?email=" + encodeURIComponent(email))
            .then(response => response.text())
            .then(data => {
                isEmailChecked = true;

                if (data === "duplicated") {
                    isEmailAvailable = false;
                    result.innerText = "이미 사용 중인 이메일입니다.";
                    result.style.color = "red";
                    
                    // [추가] 중복이면 인증 관련 레이어 전부 숨김 및 타이머 해제
                    document.getElementById("emailSendBtnGroup").style.display = "none";
                    document.getElementById("emailAuthGroup").style.display = "none";
                    if (emailTimerInterval) clearInterval(emailTimerInterval);
                } else {
                    isEmailAvailable = true;
                    // [수정] 안내 멘트 문구 뒤에 행동 유도 지침 추가
                    result.innerText = "✓ 사용 가능한 이메일입니다. 인증번호를 전송해 주세요.";
                    result.style.color = "green";
                    isEmailAuthVerified = false; // 가입 인증 상태 초기화

                    // [추가] 중복 확인 통과 시 "인증번호 전송하기" 파란 버튼 레이어만 노출!
                    document.getElementById("emailSendBtnGroup").style.display = "block";
                    document.getElementById("emailAuthGroup").style.display = "none";
                    if (emailTimerInterval) clearInterval(emailTimerInterval);
                }
            });
    }

    function resetEmailCheck() {
        isEmailChecked = false;
        isEmailAvailable = false;
        isEmailAuthVerified = false;

        const result = document.getElementById("emailCheckResult");
        result.innerText = "이메일 중복확인을 해주세요.";
        result.style.color = "gray";

        document.getElementById("emailSendBtnGroup").style.display = "none";
        document.getElementById("emailAuthGroup").style.display = "none";
        if (emailTimerInterval) clearInterval(emailTimerInterval);
    }

    function startEmailTimer(duration) {
        const display = document.getElementById("emailTimer");
        const btnVerify = document.getElementById("btnVerifyCode");
        let timer = duration, minutes, seconds;

        if (emailTimerInterval) clearInterval(emailTimerInterval);
        btnVerify.disabled = false;

        emailTimerInterval = setInterval(function () {
            minutes = parseInt(timer / 60, 10);
            seconds = parseInt(timer % 60, 10);

            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            display.innerText = minutes + ":" + seconds;

            if (--timer < 0) {
                clearInterval(emailTimerInterval);
                display.innerText = "시간 만료";
                btnVerify.disabled = true; // 3분 경과 시 버튼 잠금
                alert("인증 시간이 만료되었습니다. 다시 인증번호 전송 버튼을 눌러주세요.");
            }
        }, 1000);
    }

    window.sendEmailAuth = function() {
        const emailInput = document.getElementById("email"); // 가입창 ID인 email 사용
        const emailValue = emailInput.value.trim();
        const sendBtn = document.getElementById("btnSendEmail");

        sendBtn.disabled = true; 
        sendBtn.innerText = "발송 중...";

        // 화면 내에 숨겨져 있는 시큐리티 CSRF 토큰 스캔
        const tokenElement = document.querySelector("input[name='_csrf']");
        const csrfToken = tokenElement ? tokenElement.value : "";

        // 마이페이지 백엔드 발송 엔진 주소(/mypage/api/send-auth-email)를 그대로 호출하여 빌려 씁니다!
        fetch(`/api/public/send-auth-email`, {
            method: "POST", 
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRF-TOKEN": csrfToken // 시큐리티 가드 패스용
            },
            body: `email=${encodeURIComponent(emailValue)}`
        })
        .then(res => res.text()) // 순수 문자열 수신
        .then(data => {
            sendBtn.disabled = false;
            sendBtn.innerText = "인증번호 전송하기";

            if (data === "send_success") {
                alert("입력하신 이메일로 6자리 가입 인증번호가 성공적으로 발송되었습니다.");
                
                // 3분 타이머와 6자리 인풋창 레이어 노출!
                document.getElementById("emailAuthGroup").style.display = "block";
                startEmailTimer(180); 
            } else {
                alert("인증 메일 발송에 실패했습니다. 유효한 메일주소인지 확인해 주세요.");
            }
        })
        .catch(err => {
            sendBtn.disabled = false;
            sendBtn.innerText = "인증번호 전송하기";
            console.error("가입 메일 발송 통신 오류:", err);
        });
    };

    window.submitEmailVerification = function() {
        const emailInput = document.getElementById("email");
        const codeInput = document.getElementById("emailAuthCode");
        const codeValue = codeInput.value.trim();
        const emailValue = emailInput.value.trim();
        const authMessage = document.getElementById("emailAuthMessage");
        const btnVerify = document.getElementById("btnVerifyCode");

        if (codeValue.length !== 6 || isNaN(codeValue)) {
            alert("인증번호가 일치하지 않습니다");
            return;
        }

        const tokenElement = document.querySelector("input[name='_csrf']");
        const csrfToken = tokenElement ? tokenElement.value : "";

        // 백엔드 검증 엔진 주소(/mypage/api/verify-email-code)도 완벽하게 빌려 씁니다!
        fetch(`/api/public/verify-email-code`, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRF-TOKEN": csrfToken
            },
            body: `code=${encodeURIComponent(codeValue)}&email=${encodeURIComponent(emailValue)}`
        })
        .then(res => res.text())
        .then(data => {
            authMessage.style.display = "block";

            if (data === "verified") {
                clearInterval(emailTimerInterval); // 타이머 일시정지
                document.getElementById("emailTimer").innerText = "인증 완료";
                document.getElementById("emailTimer").style.color = "#2b8a3e";

                authMessage.style.color = "#2b8a3e";
                authMessage.innerText = "✓ 이메일 인증이 성공적으로 완료되었습니다.";
                isEmailAuthVerified = true; // 최종 서브밋 가드 통과 승인
                
                // 인증 완료 후 데이터 임의 조작 방지 안전 잠금(Lock)
                btnVerify.disabled = true;
                document.getElementById("btnSendEmail").disabled = true; 
                emailInput.readOnly = true;
                codeInput.readOnly = true;
            } else {
                authMessage.style.color = "#fa5252";
                authMessage.innerText = "✗ 인증번호가 틀렸거나 만료되었습니다. 다시 시도해 주세요.";
                isEmailAuthVerified = false;
            }
        })
        .catch(err => console.error("가입 인증 통신 오류:", err));
    };

</script>

</body>
</html>
