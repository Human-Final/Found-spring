<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 찾기</title>
  
  <!-- 기존 프로젝트 CSS 경로 적용 -->
  <link rel="stylesheet" th:href="@{/css/common/common.css}">
  <link rel="stylesheet" th:href="@{/css/user/login.css}">

  <style>
    /* 비밀번호 찾기 단계별 제어를 위한 스타일 */
    .step-section {
      display: none;
    }
    .step-section.active {
      display: block;
    }
    .timer-text {
      color: #dc3545;
      font-weight: bold;
      font-size: 13px;
      margin-top: 5px;
      display: block;
    }
    .error-message {
      color: #dc3545;
      background-color: #fdf2f2;
      border: 1px solid #fde2e2;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
      display: none;
    }
    .success-message {
      color: #28a745;
      font-size: 13px;
      margin-top: 5px;
      display: none;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .input-row input {
      flex: 1;
    }
    .btn-inline {
      width: 100px;
      background-color: #555;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-inline:hover {
      background-color: #333;
    }
    .action-links {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      font-size: 14px;
    }
    .action-links a {
      color: #666;
      text-decoration: none;
    }
    .action-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div th:replace="layout/header :: headerFragment"></div>

<main class="auth-page">
  <div class="login-modal">
    <div class="login-header">
      <h2>정보 입력</h2>
      <a href="/login" class="close-btn">×</a>
    </div>

    <div class="login-content">
      <!-- 글로벌 에러 알림창 -->
      <div id="errorMessage" class="error-message"></div>

      <!-- CSRF 토큰 공통 보관 -->
      <input type="hidden" id="csrfToken" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

      <!-- ================= [STEP 1] 회원 정보 입력 및 이메일 발송 ================= -->
      <div id="step1" class="step-section active">
        <form id="infoForm" onsubmit="sendVerificationEmail(event)">
          <div class="form-group">
            <label for="userId">아이디</label>
            <div class="input-wrap"><input type="text" id="userId" placeholder="아이디 입력" required></div>
          </div>
          <div class="form-group">
            <label for="name">이름</label>
            <div class="input-wrap"><input type="text" id="name" placeholder="이름 입력" required></div>
          </div>
          <div class="form-group">
            <label for="email">이메일</label>
            <div class="input-wrap"><input type="email" id="email" placeholder="이메일 입력" required></div>
          </div>
          <button type="submit" class="login-submit">인증번호 전송</button>
        </form>
      </div>

      <!-- ================= [STEP 2] 인증번호 3분 타이머 검증 ================= -->
      <div id="step2" class="step-section">
        <form id="codeForm" onsubmit="verifyCode(event)">
          <div class="form-group">
            <label for="authCode">인증번호 입력</label>
            <div class="input-row">
              <div class="input-wrap" style="width: 100%;">
                <input type="text" id="authCode" placeholder="인증번호 6자리 입력" required>
              </div>
            </div>
            <span id="timer" class="timer-text">03:00</span>
          </div>
          <button type="submit" class="login-submit">인증 확인</button>
        </form>
      </div>

      <!-- ================= [STEP 3] 새 비밀번호 입력 및 최종 변경 ================= -->
      <div id="step3" class="step-section">
        <form id="resetPwForm" onsubmit="submitNewPassword(event)">
          <div class="form-group">
            <label for="newPw">새 비밀번호</label>
            <div class="input-wrap">
              <input type="password" id="newPw" placeholder="새 비밀번호 입력" oninput="checkPasswordMatch()" required>
            </div>
          </div>
          <div class="form-group">
            <label for="newPwConfirm">새 비밀번호 확인</label>
            <div class="input-wrap">
              <input type="password" id="newPwConfirm" placeholder="새 비밀번호 재입력" oninput="checkPasswordMatch()" required>
            </div>
            <span id="pwMatchMessage" class="success-message"></span>
          </div>
          <button type="submit" id="submitPwBtn" class="login-submit" disabled style="background-color: #ccc; cursor: not-allowed;">회원정보 변경하기</button>
        </form>
      </div>

      <!-- 하단 네비게이션 링크 -->
      <div class="action-links">
        <a href="/login">로그인하러 가기</a>
        <span style="color: #ccc;">|</span>
        <a href="/find-id">아이디 찾기</a>
      </div>
    </div>
  </div>
</main>

<div th:replace="layout/footer :: footerFragment"></div>

<script>
    let timerInterval;
    let timeLeft = 180; // 3분 (180초)

    // 1단계: 회원 정보 일치 확인 후 인증 이메일 발송
    function sendVerificationEmail(event) {
        event.preventDefault();
        const userId = document.getElementById('userId').value;
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const csrfToken = document.getElementById('csrfToken').value;
        const errorDiv = document.getElementById('errorMessage');

        errorDiv.style.display = 'none';

        // 컨트롤러의 @RequestParam 수신 규격에 맞춰 파라미터 포장
        const params = new URLSearchParams();
        params.append('userId', userId);
        params.append('name', name);
        params.append('email', email);

        // fetch진행하기 전에 로딩 창 띄우기
        errorDiv.innerText = "인증 메일을 보내는 중입니다. 잠시만 기다려 주세요...";
        errorDiv.style.backgroundColor = "#e8f0fe"; // 파란색 로딩 박스 스타일
        errorDiv.style.color = "#1a73e8";
        errorDiv.style.display = 'block';

        // 실제 매핑 주소인 '/find-pw'로 정확하게 요청을 보냅니다.
        fetch('/find-pw', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRF-TOKEN': csrfToken 
        },
        body: params
        })
        .then(response => response.text())
        .then(data => {
        // 컨트롤러가 주는 리턴값 분기 처리
        if (data === "send_success") {
            errorDiv.style.display = 'none';
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            startTimer();
        } else if (data === "no_user") {
            throw new Error('일치하는 회원 정보가 없습니다.');
        } else {
            throw new Error('인증 메일 발송에 실패했습니다.');
        }
        })
        .catch(error => {
        errorDiv.style.backgroundColor = "#fdf2f2"; 
        errorDiv.style.color = "#dc3545";
        errorDiv.innerText = error.message;
        errorDiv.style.display = 'block';
        });
    }

    // 3분 타이머 가동 함수
    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 180;
        const timerElement = document.getElementById('timer');
        document.getElementById('authCode').disabled = false;

        timerInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;

        timerElement.innerText = `${minutes}:${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerElement.innerText = "인증 시간이 만료되었습니다. 다시 시도해 주세요.";
            document.getElementById('authCode').disabled = true;
        }
        timeLeft--;
        }, 1000);
    }

    // 2단계: 인증번호 검증
    function verifyCode(event) {
        event.preventDefault();
        const code = document.getElementById('authCode').value;
        const email = document.getElementById('email').value;
        const csrfToken = document.getElementById('csrfToken').value;
        const errorDiv = document.getElementById('errorMessage');

        if (timeLeft <= 0) {
        alert("인증 시간이 만료되었습니다.");
        return;
        }

        const params = new URLSearchParams();
        params.append('code', code);
        params.append('email', email);

        // 컨트롤러의 실제 2단계 주소 지정
        fetch('/find-pw/verify-code', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRF-TOKEN': csrfToken 
        },
        body: params
        })
        .then(response => response.text())
        .then(data => {
        if (data === "verified") {
            clearInterval(timerInterval);
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            errorDiv.style.display = 'none';
        } else if (data === "timeout") {
            throw new Error('인증 시간이 초과되었습니다.');
        } else if (data === "wrong_code") {
            throw new Error('인증번호가 올바르지 않습니다.');
        } else {
            throw new Error('인증에 실패했습니다. 다시 시도해 주세요.');
        }
        })
        .catch(error => {
        errorDiv.innerText = error.message;
        errorDiv.style.display = 'block';
        });
    }

    // 3단계: 새 비밀번호 실시간 매칭 확인
    function checkPasswordMatch() {
        const newPw = document.getElementById('newPw').value;
        const newPwConfirm = document.getElementById('newPwConfirm').value;
        const matchMsg = document.getElementById('pwMatchMessage');
        const submitBtn = document.getElementById('submitPwBtn');

        if (!newPw || !newPwConfirm) {
        matchMsg.style.display = 'none';
        return;
        }

        if (newPw === newPwConfirm) {
        matchMsg.innerText = "비밀번호가 일치합니다.";
        matchMsg.style.color = "#28a745";
        matchMsg.style.display = "block";
        
        submitBtn.disabled = false;
        submitBtn.style.backgroundColor = "#1a73e8";
        submitBtn.style.cursor = "pointer";
        } else {
        matchMsg.innerText = "비밀번호가 일치하지 않습니다.";
        matchMsg.style.color = "#dc3545";
        matchMsg.style.display = "block";
        
        submitBtn.disabled = true;
        submitBtn.style.backgroundColor = "#ccc";
        submitBtn.style.cursor = "not-allowed";
        }
    }

    // 최종 단계: 새 비밀번호 변경 처리 완료
    function submitNewPassword(event) {
        event.preventDefault();    
        if(validateJoinForm()){
            
            const newPw = document.getElementById('newPw').value;
            const csrfToken = document.getElementById('csrfToken').value;
            const errorDiv = document.getElementById('errorMessage');

            const params = new URLSearchParams();
            params.append('password', newPw);

            // 컨트롤러의 실제 3단계 주소 지정
            fetch('/find-pw/reset', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRF-TOKEN': csrfToken 
            },
            body: params
            })
            .then(response => response.text())
            .then(data => {
            if (data === "SUCCESS") {
                alert("비밀번호가 정상적으로 변경되었습니다. 다시 로그인해 주세요.");
                window.location.href = "/login";
            } else if (data === "forbidden") {
                throw new Error('정상적인 접근이 아닙니다. 인증을 다시 진행해 주세요.');
            } else {
                throw new Error('비밀번호 변경 중 오류가 발생했습니다.');
            }
            })
            .catch(error => {
            errorDiv.innerText = error.message;
            errorDiv.style.display = 'block';
            });
        }
    }

  function validateJoinForm() {
    if (!validatePassword()) {
            alert("비밀번호 규칙을 확인해주세요.");
            return false;
        }
    return true;
  }

  function validatePassword() {
        const pw = document.getElementById("newPw").value;
        const result = document.getElementById("pwMatchMessage");

        let count = 0;

        if (/[A-Z]/.test(pw)) count++;
        if (/[a-z]/.test(pw)) count++;
        if (/[0-9]/.test(pw)) count++;
        if (/[^A-Za-z0-9]/.test(pw)) count++;

        if (pw.length < 8) {
            result.innerText = "비밀번호는 8자 이상이어야 합니다.";
            result.style.color = "red";
            return false;
        }

        if (count < 3) {
            result.innerText = "대문자, 소문자, 숫자, 특수문자 중 3가지 이상 포함해야 합니다.";
            result.style.color = "red";
            return false;
        }

        result.innerText = "사용 가능한 비밀번호입니다.";
        result.style.color = "green";
        return true;
    }


</script>



</body>
</html>
